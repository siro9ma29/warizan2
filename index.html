/* ---------- PLAN BUILDER (指隠し + 修正ループ) ---------- */
function stageTrials(partial, divisor) {
  if (partial < divisor) {
    return { estimate: 0, trials: [{q:0,product:0,canSub:true}], finalQ:0, product:0, remainder:partial, corrections:0, isZero:true };
  }
  let q = estimateQuotientDigit(partial, divisor);
  const trials = [];
  while (q >= 1) {
    const product = q * divisor;
    const canSub = product <= partial;
    trials.push({ q, product, canSub });
    if (canSub) break;
    q--;
  }
  const f = trials[trials.length-1];
  return { estimate: trials[0].q, trials, finalQ: f.q, product: f.product, remainder: partial - f.product, corrections: trials.length-1, isZero:false };
}

function buildPlan(dividend, divisor) {
  const digits = String(dividend).split('').map(Number);
  const n = digits.length;
  let firstPos = -1, acc = 0;
  for (let p = 0; p < n; p++) { acc = acc*10 + digits[p]; if (acc >= divisor) { firstPos = p; break; } }
  if (firstPos === -1) firstPos = n - 1;

  const stages = [];
  let partial = 0;
  for (let i = 0; i < n; i++) {
    partial = partial*10 + digits[i];
    if (i < firstPos) continue;
    const st = stageTrials(partial, divisor);
    // stage の各カラム開始位置(partial の左端)
    const start = (i === firstPos) ? firstPos : i;
    stages.push({ position: i, partial, partialStart: start, partialEnd: i, ...st });
    partial = st.remainder;
  }

  // フラットな手順列を構築
  // 商がたたないくらい(firstPos より左)には、商のかわりに × をつける
  const steps = [];
  for (let p = 0; p < firstPos; p++) {
    // そのくらいまでで作れる数(例 63÷21 なら 6、153÷24 なら 1 と 15)
    const acc2 = Number(String(dividend).slice(0, p + 1));
    steps.push({ kind:'tateru', skip:true, stageIdx:0, position:p, value:'×', partialSoFar:acc2 });
  }
  // 各 stage: たてる(見当) → [かける → ひく → (ひけない: へらす → かける → ひく) ...] → おろす(次段があれば)
  stages.forEach((stage, sIdx) => {
    stage.trials.forEach((tr, tIdx) => {
      const isLastTrial = (tIdx === stage.trials.length - 1);
      if (tIdx === 0) {
        steps.push({ kind:'tateru', stageIdx:sIdx, position:stage.position, value: tr.q });
      } else {
        steps.push({ kind:'herasu', stageIdx:sIdx, position:stage.position, value: tr.q });
      }
      steps.push({ kind:'kakeru', stageIdx:sIdx, position:stage.position, value: tr.product, qForMult: tr.q, canSub: tr.canSub, trialIdx: tIdx });
      steps.push({ kind:'hiku',   stageIdx:sIdx, position:stage.position, canSub: tr.canSub,
                   value: tr.canSub ? stage.remainder : null, product: tr.product, partial: stage.partial });
    });
    // 次の段があれば おろす
    if (sIdx < stages.length - 1) {
      const nextStage = stages[sIdx+1];
      steps.push({ kind:'orosu', stageIdx:sIdx, position:nextStage.position, value: digits[nextStage.position] });
    }
  });

  return { dividend, divisor, digits, n, firstPos, stages, steps,
           quotient: Math.floor(dividend/divisor), remainder: dividend % divisor };
}

/* ランダム生成: 条件を満たすまで試行 */
function genByCond(cond) {
  let guard = 0;
  while (guard < 40000) {
    guard++;
    // わる数は2けた/3けたの両方を候補にする(レベル7用)
    const divisor  = (Math.random() < 0.25) ? rand(100, 999) : rand(11, 99);
    const dividend = rand(10, 999);
    if (dividend < divisor) continue;
    const a = analyzeForGen(dividend, divisor);
    if (!a) continue;
    if (cond(a)) return [dividend, divisor];
  }
  return [96, 32]; // フォールバック
}

/* 2けた÷2けた専用のせまい範囲での生成。
   genByCond は3けたも含む広い範囲から探すため、"修正ちょうどN回"のような
   出現率の低い条件だと40000回のガードに引っかかりフォールバック([96,32]=修正0回)
   を返してしまうことがある(レベル2の各問目の出題ルールが崩れる原因になる)。
   2けた÷2けただけに絞って探すことで、必ず条件に合う組を高確率で見つけられるようにする。 */
function gen2x2ByCorr(divisorMin, divisorMax, corrTarget) {
  let guard = 0;
  while (guard < 40000) {
    guard++;
    const divisor  = rand(divisorMin, divisorMax);
    const dividend = rand(10, 99);
    if (dividend < divisor) continue;
    const a = analyzeForGen(dividend, divisor);
    if (!a) continue;
    if (a.dvLen === 2 && a.ddLen === 2 && a.qDigits === 1 && a.maxCorr === corrTarget) {
      return [dividend, divisor];
    }
  }
  // 万一見つからない場合の最終手段として総当たりで探す(理論上ここには来ない)
  for (let divisor = divisorMin; divisor <= divisorMax; divisor++) {
    for (let dividend = divisor; dividend <= 99; dividend++) {
      const a = analyzeForGen(dividend, divisor);
      if (a && a.dvLen === 2 && a.ddLen === 2 && a.qDigits === 1 && a.maxCorr === corrTarget) {
        return [dividend, divisor];
      }
    }
  }
  return [96, 32]; // それでも見つからない場合のフォールバック
}
function analyzeForGen(dividend, divisor) {
  const plan = buildPlan(dividend, divisor);
  let maxCorr = 0, anyZeroQ = false;
  for (const s of plan.stages) {
    if (s.finalQ === 0 || s.isZero) anyZeroQ = true;
    maxCorr = Math.max(maxCorr, s.corrections);
  }
  const qStr = String(plan.quotient);
  return {
    dividend, divisor,
    remainder: plan.remainder,
    maxCorr,
    anyZeroQ,                       // 途中の段で商0が立つか
    qDigits: qStr.length,
    zeroInQ: qStr.includes('0'),    // 商の中に0のけたがあるか
    dvLen: String(divisor).length,  // わる数のけた数
    ddLen: String(dividend).length  // わられる数のけた数
  };
}

/* ---------- GAME STATE ---------- */
const state = {
  level: null, mode: 'fixed', questions: [], qIdx: 0, correctCount: 0, current: null
};

/* ---------- CELL SIZE ---------- */
/* パネルを「左:わり算のひっ算」「右:かけ算の縦ひっ算」に分ける。
   かけ算ひっ算は 4カラム(×+3桁) + 「✗ひけない」ノート ぶんの幅が要る。 */
function getWorkspaceWidth(cell, divisor) {
  // かけ算ひっ算を横ならびで最大2つ置けるよう、やや広めに予約する。
  // 1つ分 = 本体4カラム + ノート約3.6 = 7.6マス。2つで間1マスあけて 16.2マス。
  // ただし わり算ひっ算を潰しすぎないよう、実サイズは getMultLayout 側で縮小して調整する。
  // 予約幅は getMultLayout の HISSAN_COLS と同じ式で求める(定数の二重管理をやめる)。
  //   本体 = 「×」1マス + max(わる数のけた数, わる数×9 のけた数)
  //   ノート = 3.6マス(「✗ ひけない」メモ)   余白 = 0.8マス
  const dvLen = String(divisor).length;
  const bodyCols = 1 + Math.max(dvLen, String(divisor * 9).length);
  return cell * (bodyCols + 3.6 + 0.8);
}

function getCellSize() {
  const panel = document.getElementById('calcPanel');
  const w = panel.clientWidth  || window.innerWidth * 0.5;
  const h = panel.clientHeight || window.innerHeight * 0.4;
  let rows = 8, cols = 5;
  const c = state.current;
  let divisor = 25;
  if (c && c.plan) {
    const n = c.n;
    rows = 2 + c.plan.stages.length * 2;
    cols = String(c.divisor).length + n + 1; // わる数桁 + ブラケット余白 + わられる数
    divisor = c.divisor;
  }
  const candH = Math.floor(h / (rows + 1.2));
  // 横: パネル幅に「ひっ算(cols マス) + かけ算メモ + 左右余白」が収まること。
  // メモ幅は cell に比例するので条件は cell について単調 → 二分探索で最大値を出す。
  // (v2.4.0 までの反復代入は仮定値と結果が行き来して振動し、下限の28pxに張り付いていた)
  const CELL_MAX = 112, CELL_MIN = 30;
  const fits = (cd) => (cols * cd + getWorkspaceWidth(cd, divisor) + w * 0.05) <= w;
  let lo = CELL_MIN, hi = Math.min(candH, CELL_MAX);
  if (hi <= lo || !fits(lo)) return CELL_MIN;
  if (fits(hi)) return hi;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (fits(mid)) lo = mid; else hi = mid;
  }
  return lo;
}

/* ---------- RENDER DIVISION ---------- */
function renderDivision() {
  const c = state.current;
  const plan = c.plan;
  const { divisor, digits, n } = c;
  const stages = plan.stages;

  const cell = getCellSize();
  document.documentElement.style.setProperty('--cell', cell + 'px');

  const panel = document.getElementById('calcPanel');
  const div = document.getElementById('division');
  div.innerHTML = '';

  const dvStr = String(divisor);
  const dvLen = dvStr.length;       // 2 または 3

  const DIVISOR_START_COL = 0;      // わる数は col0 から左詰め
  // v2.8.4: わられる数の先頭カラムは「わる数のけた数」。
  //         2 固定だと 3けたのわる数(レベル7)で わる数の一の位と わられる数が同じマスに重なる。
  const FIRST_DIGIT_COL = dvLen;
  const QUOTIENT_ROW = 0;
  const DIVIDEND_ROW = 1;

  const totalCols = dvLen + n + 1;
  const totalRows = 2 + stages.length * 2;
  const divWidth = totalCols * cell;
  const divHeight = totalRows * cell;

  const pw = panel.clientWidth, ph = panel.clientHeight;
  // ひっ算は左に寄せる(右にかけ算メモの領域を確保)。
  // 上部の空白をなくすため、上端近くに配置する。
  // ただし「へらす」で商の上に積む数のぶん、ヘッドルームを確保する。
  const leftMargin = Math.max(cell * 0.3, pw * 0.035);
  const snapLeft = Math.round(leftMargin / cell) * cell + Math.round(cell*0.2);
  // この問題で1つの位で最大何回へらすか(=trials.length-1 の最大)
  let maxHerasu = 0;
  stages.forEach(s => { if (s.trials) maxHerasu = Math.max(maxHerasu, s.trials.length - 1); });
  // わり算の筆算じたいの上端: 「商の上に積む数」ぶんのヘッドルームだけ確保する
  // (v2.10.0: ヒントボタン廃止により、かけ算メモの領域はこれとは独立に
  //  画面のいちばん上からいちばん下まで使えるようにした → 下の positionMultWorkspace 呼び出し参照)
  const topMargin = cell * (1.0 + maxHerasu * 0.82 + 0.3);
  let rawTop = topMargin;
  if (rawTop + divHeight > ph) rawTop = Math.max(cell * 0.4, ph - divHeight);
  const snapTop  = Math.max(0, Math.round(rawTop / cell) * cell);

  div.style.width  = divWidth + 'px';
  div.style.height = divHeight + 'px';
  div.style.left = snapLeft + 'px';
  div.style.top  = snapTop + 'px';

  document.documentElement.style.setProperty('--gx', snapLeft + 'px');
  document.documentElement.style.setProperty('--gy', snapTop + 'px');

  function placeCell(col, row, content, opts = {}) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.style.left = (col * cell) + 'px';
    el.style.top  = (row * cell) + 'px';
    el.textContent = content;
    if (opts.id) el.id = opts.id;
    if (opts.className) el.className += ' ' + opts.className;
    div.appendChild(el);
    return el;
  }
  function placeEmpty(col, row, id) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.style.left = (col * cell) + 'px';
    el.style.top  = (row * cell) + 'px';
    el.id = id;
    div.appendChild(el);
    return el;
  }

  // わる数(2桁) を col 0,1 に配置
  for (let i = 0; i < dvLen; i++) {
    const el = document.createElement('div');
    el.className = 'divisor-cell';
    el.id = `divisor-${i}`;
    el.style.left = (i * cell) + 'px';
    el.style.top  = (DIVIDEND_ROW * cell) + 'px';
    el.textContent = dvStr[i];
    div.appendChild(el);
  }

  // ブラケット )
  const bracket = document.createElement('div');
  bracket.className = 'bracket-line';
  bracket.style.left = (cell * FIRST_DIGIT_COL) + 'px';
  bracket.style.transform = 'translateX(-50%)';
  bracket.style.top  = (DIVIDEND_ROW * cell + cell * 0.1) + 'px';
  bracket.style.height = (cell * 0.8) + 'px';
  div.appendChild(bracket);

  // 上線
  const topBar = document.createElement('div');
  topBar.className = 'top-bar-line';
  topBar.style.left  = (cell * FIRST_DIGIT_COL) + 'px';
  topBar.style.top   = (DIVIDEND_ROW * cell) + 'px';
  topBar.style.width = (cell * n) + 'px';
  div.appendChild(topBar);

  // わられる数
  for (let i = 0; i < n; i++) {
    placeCell(FIRST_DIGIT_COL + i, DIVIDEND_ROW, digits[i], { id: `d-${i}` });
  }
  // 商の空マス
  for (let i = 0; i < n; i++) {
    placeEmpty(FIRST_DIGIT_COL + i, QUOTIENT_ROW, `q-${i}`);
  }

  // 各段の 積行 / あまり行
  stages.forEach((stage, stageIdx) => {
    const productRow   = 2 + stageIdx * 2;
    const remainderRow = 3 + stageIdx * 2;
    for (let i = 0; i < n; i++) {
      placeEmpty(FIRST_DIGIT_COL + i, productRow, `p-${stage.position}-${i}`);
      placeEmpty(FIRST_DIGIT_COL + i, remainderRow, `r-${stage.position}-${i}`);
    }
    // v2.8.4: たてすぎ(ひけない)の積は、ひかれる数より1けた多くなることがある。
    // 例) 92 ÷ 28 で 4をたてると 28×4=112 → 3けた。
    // そのぶん、わられる数の左どなり(=わる数の一の位の下)に はみ出しマスを用意する。
    const ovMax = productOverflowCols(stage);
    for (let k = 1; k <= ovMax; k++) {
      placeEmpty(FIRST_DIGIT_COL - k, productRow, prodCellId(stage.position, -k));
    }
    const subLine = document.createElement('div');
    subLine.className = 'sub-line';
    subLine.id = `subline-${stage.position}`;
    subLine.style.left  = (FIRST_DIGIT_COL * cell) + 'px';
    subLine.style.top   = ((productRow + 1) * cell) + 'px';
    subLine.style.width = (n * cell) + 'px';
    subLine.style.display = 'none';
    div.appendChild(subLine);
  });

  // かけ算ワークスペースの位置を設定
  // かけ算メモの上端は、わり算じしんの位置(snapTop)には合わせず、
  // 画面のいちばん上ぎりぎり(旧ヒントボタンのあった余白)から始める。
  // これで「上から下まで」目いっぱいの高さを、修正回数の多い問題のために使える。
  const wsTop = Math.max(0, Math.round(Math.max(cell * 0.3, ph * 0.02) / cell) * cell);
  positionMultWorkspace(snapLeft + divWidth, wsTop, cell);
}

/* かけ算ワークスペースを筆算の右側の予約領域に配置(背景グリッドに整列) */
function positionMultWorkspace(rightX, topY, cell) {
  const ws = document.getElementById('multWorkspace');
  const panel = document.getElementById('calcPanel');
  const pw = panel.clientWidth, ph = panel.clientHeight;
  const gx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gx')) || 0;
  const gy = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gy')) || 0;
  // 筆算の右に1マスあけて、背景グリッドの線に合わせて左端を決める
  let left = rightX + cell * 0.9;
  // gx を基準にセル単位でスナップ
  left = gx + Math.round((left - gx) / cell) * cell;
  const wsW = getWorkspaceWidth(cell, state.current ? state.current.divisor : 25);
  const maxLeft = pw - wsW;
  if (left > maxLeft) left = gx + Math.floor((Math.max(rightX + cell*0.3, maxLeft) - gx) / cell) * cell;
  if (left < rightX + cell*0.2) left = rightX + cell*0.2;
  // 上端も背景グリッドに合わせる(タイトルはこの上、ひっ算は行単位)
  let top = topY;
  top = gy + Math.round((top - gy) / cell) * cell;
  ws.style.left = left + 'px';
  ws.style.top  = top + 'px';
  ws.style.width = (pw - left) + 'px';
  ws.style.height = (ph - top) + 'px';
  ws.style.overflow = 'hidden';
}

/* ---------- MASKING (指隠し) ---------- */
function setupMaskingForTateru(step) {
  // わる数の一の位・わられる数(partial)の一の位を「隠せる」状態にする
  const c = state.current;
  const stage = c.plan.stages[step.stageIdx];
  clearMaskables();

  // わる数: 最上位1けたを残して、下のけたをすべて隠せるようにする
  //   2けた(23)  → 一の位 3 を隠す
  //   3けた(216) → 十の位 1 と 一の位 6 を隠す
  const dvLen = String(c.divisor).length;
  const hide = maskDigits(c.divisor);          // 隠すけた数
  for (let k = 0; k < hide; k++) {
    const el = document.getElementById(`divisor-${dvLen - 1 - k}`);
    if (el) makeMaskable(el, 'divisor');
  }

  // partial 側も同じけた数だけ、右から隠せるようにする
  // 初段: わられる数の d-列。2段目以降: 前段の あまり行 / おろした数
  const prevStage = (step.stageIdx > 0) ? c.plan.stages[step.stageIdx - 1] : null;
  const partialCellId = (col) =>
    (step.stageIdx === 0) ? `d-${col}` : `r-${prevStage.position}-${col}`;

  for (let k = 0; k < hide; k++) {
    const col = stage.partialEnd - k;
    if (col < stage.partialStart) break;
    const el = document.getElementById(partialCellId(col));
    if (el) makeMaskable(el, 'partial');
  }

  // 十の位を強調(青)
  // v2.6.0: 「たてる」では けんとうに使う数ぜんぶ を緑でフラッシュさせるため、
  //         色がぶつかる青の十の位強調は「へらす」のときだけ出す。
  if (step.kind === 'herasu') highlightTens(step);
}

function highlightTens(step) {
  // 「隠したあとに残るけた」を青で強調する。
  // 2けた(23)なら十の位、3けた(216)なら百の位。
  const c = state.current;
  const stage = c.plan.stages[step.stageIdx];
  const dvLen = String(c.divisor).length;
  const hide = maskDigits(c.divisor);

  // わる数の最上位けた
  const divTop = document.getElementById(`divisor-${dvLen - 1 - hide}`);
  if (divTop) divTop.classList.add('tens-focus');

  // partial 側の対応するけた(隠す分だけ左)
  const topCol = stage.partialEnd - hide;
  if (topCol >= stage.partialStart) {
    let topId;
    if (step.stageIdx === 0) topId = `d-${topCol}`;
    else {
      const prevStage = c.plan.stages[step.stageIdx - 1];
      topId = `r-${prevStage.position}-${topCol}`;
    }
    const el = document.getElementById(topId);
    if (el && el.textContent !== '') el.classList.add('tens-focus');
  }
}

function makeMaskable(cellEl, type) {
  cellEl.classList.add('maskable');
  cellEl.dataset.maskType = type;
  cellEl.onclick = () => toggleMask(cellEl);
}
function toggleMask(cellEl) {
  const c = state.current;
  if (cellEl.dataset.masked === '1') {
    // 戻す
    const cover = document.getElementById('mask-' + cellEl.id);
    if (cover) cover.remove();
    cellEl.dataset.masked = '';
  } else {
    // 隠す
    const cell = getCellSize();
    const cover = document.createElement('div');
    cover.className = 'mask-cover';
    cover.id = 'mask-' + cellEl.id;
    cover.style.left = cellEl.style.left;
    cover.style.top  = cellEl.style.top;
    cover.style.width = cell + 'px';
    cover.style.height = cell + 'px';
    cover.onclick = (e) => { e.stopPropagation(); toggleMask(cellEl); };
    document.getElementById('division').appendChild(cover);
    cellEl.dataset.masked = '1';
    if (navigator.vibrate) navigator.vibrate(15);
  }
}
function clearMaskables() {
  document.querySelectorAll('.cell.maskable, .divisor-cell.maskable').forEach(el => {
    el.classList.remove('maskable');
    el.onclick = null;
    el.dataset.maskType = '';
  });
  document.querySelectorAll('.tens-focus').forEach(el => el.classList.remove('tens-focus'));
}
function clearAllMasks() {
  document.querySelectorAll('.mask-cover').forEach(el => el.remove());
  document.querySelectorAll('[data-masked="1"]').forEach(el => el.dataset.masked = '');
  clearMaskables();
}

/* ---------- DIM UNUSED DIGITS (けんとうに使わないけたを薄く) ---------- */
/* いま見ているくらい(step.position)より右にある「わられる数」のけたを薄く表示する。
   step.position は × / たてる / へらす / かける / ひく では「いま計算しているくらい」、
   おろす では「これからおろすくらい」を指すので、これ1つで全ステップを扱える。

   ■ いつ薄くなるか (v2.4.0)
   問題が出た直後は 薄くしない(数の全体をまず読ませる)。
   「たてる」または「へらす」ボタンを押した瞬間に、そのくらいで dim を ON にする(=arm)。
   一度 ON になったら、同じくらいのあいだ(たてる→かける→ひく)は薄いまま。
   「おろす」でくらいが1つ右に移ると arm が外れて全体がはっきりし、
   次の「たてる」を押すとまた薄くなる。

     154 ÷ 15   もんだいが出たとき   → 薄いけたなし (154 がぜんぶ見える)
                「たてる」をおすと    → 「54」が薄い  (1÷15 をみる)
                × を書いて つぎのたてる→ 「4」が薄い   (15÷15 をみる)
                かける・ひくのあいだ  → 「4」は薄いまま
                「おろす」をおすと    → 薄いけたなし (154 がぜんぶ見える)

   薄さは CSS 変数 --dim-alpha で調整できる(0=見えない / 1=ふつう)。
   開始タイミングは DIM_ON_TATERU_ONLY で切り替えられる。 */
function activeColForStep(step) {
  if (!step) return null;
  return (typeof step.position === 'number') ? step.position : null;
}

/* 商のけんとうをするステップか(× をふくむ たてる / へらす) */
function isEstimateStep(step) {
  return !!step && (step.kind === 'tateru' || step.kind === 'herasu');
}

/* 「たてる」「へらす」を押したときに、そのくらいの dim を有効化する */
function armDimForStep(step) {
  const c = state.current;
  if (!c) return;
  if (isEstimateStep(step)) c.dimArmedCol = activeColForStep(step);
  updateDimUnused();
}

function updateDimUnused() {
  const c = state.current;
  if (!c || !c.plan) return;
  const step = c.completed ? null : c.plan.steps[c.stepIdx];
  let activeCol = activeColForStep(step);
  // たてるを押すまで(=そのくらいが arm されるまで)は薄くしない
  if (DIM_ON_TATERU_ONLY && activeCol !== null && c.dimArmedCol !== activeCol) activeCol = null;
  for (let i = 0; i < c.n; i++) {
    const el = document.getElementById(`d-${i}`);
    if (!el) continue;
    el.classList.toggle('dim-unused', activeCol !== null && i > activeCol);
  }
}

function clearDimUnused() {
  document.querySelectorAll('.cell.dim-unused').forEach(el => el.classList.remove('dim-unused'));
}

/* ---------- SPOTLIGHT / HINT ---------- */
function clearSpotlight() {
  document.querySelectorAll('.cell.spot').forEach(c => c.classList.remove('spot'));
  clearHints();
}
function clearHints() {
  document.querySelectorAll('.hint-source').forEach(c => c.classList.remove('hint-source'));
  document.querySelectorAll('.op-hint').forEach(el => el.remove());
  document.querySelectorAll('.borrow-mark').forEach(el => el.remove());  // v2.7.0
  const borrowBtn = document.getElementById('borrowBtn');
  if (borrowBtn) borrowBtn.classList.remove('show');  // v2.8.0
}

function spotlightForStep(step) {
  clearSpotlight();
  const c = state.current;
  const plan = c.plan;
  const stage = plan.stages[step.stageIdx];
  if (!step) return;

  if (step.kind === 'tateru' || step.kind === 'herasu') {
    const q = document.getElementById(`q-${step.position}`);
    if (q) q.classList.add('spot');
  }
  else if (step.kind === 'kakeru') {
    // 積を書くマス(あまり行の上の積行) は使わず、右のワークスペースに書くため
    // 商マスを軽く示す
    const q = document.getElementById(`q-${step.position}`);
    if (q) q.classList.add('spot');
  }
  else if (step.kind === 'hiku') {
    if (step.canSub) {
      const remLen = String(stage.remainder).length || 1;
      const startCol = stage.partialEnd - remLen + 1;
      // v2.9.0: あまりが partialStart より左の桁にまではみ出すことがある(例: 109÷11 の一の位の段)。
      // 入力マス(getInputCellIds)と同じ範囲を対象にしないと、十の位が黄色にならないバグになる。
      for (let i = startCol; i <= stage.partialEnd; i++) {
        const cc = document.getElementById(`r-${step.position}-${i}`);
        if (cc) cc.classList.add('spot');
      }
    }
  }
  else if (step.kind === 'orosu') {
    const prevStage = [...plan.stages].filter(s => s.position < step.position).pop();
    if (prevStage) {
      const cc = document.getElementById(`r-${prevStage.position}-${step.position}`);
      if (cc) cc.classList.add('spot');
    }
  }
}

/* 計算ヒント(緑パルス) */
function showHintForStep(step) {
  clearHints();
  if (!step) return;

  // 「ひく」の緑ハイライトは“ヒント”ではなく手順の中核なので、
  // ランダムモードや問題番号のゲートに関わらず常に表示する。
  // 赤枠の数字(ひかれる数=上の行 全桁 と ひくかず=積の行 全桁)をすべて緑に。
  if (step.kind === 'hiku' && step.canSub) {
    [...getMinuendCellIds(step.stageIdx), ...getProductCellIds(step)]
      .forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hint-source'); });
    renderResolvedBorrowMarks(step);  // v2.8.0: 「かりる」で確定ずみの位だけ再描画(リサイズ対応)
  }

  // 「たてる」の緑ハイライト(v2.6.0)。
  // 商のけんとうに使う数 = わられる数がわの「いま見ている数」+ わる数ぜんぶ。
  //   86 ÷ 43 の × のくらい   → 「8」と「43」が光る
  //   86 ÷ 43 の たてる        → 「86」と「43」が光る
  //   154 ÷ 15 の2段目のたてる → あまり行の「4?」と「15」が光る
  // これも“ヒント”ではなく手順の中核なので、モードや問題番号のゲートに関わらず常に出す。
  // 「へらす」では出さない(青の十の位強調と 指隠しの導線をそのまま残すため)。
  if (step.kind === 'tateru') {
    getEstimateSourceCellIds(step)
      .forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hint-source'); });
    document.querySelectorAll('.divisor-cell').forEach(el => el.classList.add('hint-source'));
  }

  if (state.mode === 'random') return;
  const qNum = state.qIdx + 1;
  const autoShow = (qNum <= 3);
  if (!autoShow && !state.current.hintRequested) return;

  const c = state.current;
  const stage = c.plan.stages[step.stageIdx];

  if (step.kind === 'kakeru') {
    // 商マス × わる数
    const qEl = document.getElementById(`q-${step.position}`);
    if (qEl) qEl.classList.add('hint-source');
    document.querySelectorAll('.divisor-cell').forEach(el => el.classList.add('hint-source'));
  }
}

/* たてる で緑にする「わられる数がわ」のセル。
   × のくらい(skip): わられる数の左端から そのくらいまで(例 153÷24 の2つめの × なら d-0,d-1 = 「15」)
   ふつうのたてる    : いま見ている partial。1段目は わられる数の該当けた、
                       2段目以降は 前段のあまり行(おろした数をふくむ)。
   後者は「ひく」でひかれる数と同じ範囲なので getMinuendCellIds をそのまま使う。 */
function getEstimateSourceCellIds(step) {
  if (step.skip) {
    const ids = [];
    for (let i = 0; i <= step.position; i++) ids.push(`d-${i}`);
    return ids;
  }
  return getMinuendCellIds(step.stageIdx);
}

/* ひく で緑にする「ひかれる数(上の行)」の全セル。
   1段目: partial(例648)を作るわられる数の各桁 d-0..d-(len-1)。
   2段目以降: 前段あまり行の(空でない)セル。 */
function getMinuendCellIds(stageIdx) {
  const c = state.current;
  const stage = c.plan.stages[stageIdx];
  const ids = [];
  if (stageIdx === 0) {
    // partial の桁数ぶん、わられる数の左から並ぶ (d-0 が最上位)
    const len = String(stage.partial).length;
    for (let i = 0; i < len; i++) ids.push(`d-${i}`);
  } else {
    const prevStage = c.plan.stages[stageIdx - 1];
    for (let i = 0; i < c.n; i++) {
      const el = document.getElementById(`r-${prevStage.position}-${i}`);
      if (!el || el.textContent === '') continue;
      if (el.classList.contains('faded')) continue;
      ids.push(`r-${prevStage.position}-${i}`);
    }
  }
  return ids;
}

/* v2.8.4: 積の行のマスid。
   col が 0以上 → わられる数と同じけた位置(p-{position}-{col})。
   col が 負    → たてすぎで左へはみ出したマス(p-{position}-ov{n})。
   id に負の数を入れると id.split('-').pop() での列番号取り出しが壊れるため、別名にしている。 */
function prodCellId(position, col) {
  return col < 0 ? `p-${position}-ov${-col}` : `p-${position}-${col}`;
}

/* v2.8.4: その段で積が左へ何マスはみ出しうるか(たてすぎの試行を含めた最大) */
function productOverflowCols(stage) {
  let ov = 0;
  (stage.trials || []).forEach(t => {
    const len = String(t.product).length;
    ov = Math.max(ov, len - stage.partialEnd - 1);
  });
  return Math.max(0, ov);
}

/* ひく で緑にする「ひくかず(積の行)」の全セル */
function getProductCellIds(step) {
  const c = state.current;
  const stage = c.plan.stages[step.stageIdx];
  const prodLen = String(step.product).length;
  const startCol = stage.partialEnd - prodLen + 1;
  const ids = [];
  for (let col = startCol; col <= stage.partialEnd; col++) ids.push(prodCellId(step.position, col));
  return ids;
}

function getPartialCellIds(stageIdx) {
  const c = state.current;
  const stage = c.plan.stages[stageIdx];
  const ids = [];
  if (stageIdx === 0) {
    for (let i = stage.partialStart; i <= stage.partialEnd; i++) ids.push(`d-${i}`);
  } else {
    const prevStage = c.plan.stages[stageIdx - 1];
    for (let i = 0; i < c.n; i++) {
      const el = document.getElementById(`r-${prevStage.position}-${i}`);
      if (!el || el.textContent === '') continue;
      if (el.classList.contains('faded')) continue;
      ids.push(`r-${prevStage.position}-${i}`);
    }
  }
  return ids;
}

/* v2.7.0: 「ひく」でくり下がりが必要な位を検出する。
   ひかれる数(getMinuendCellIds)とひくかず(getProductCellIds)を、
   実際のマスidに含まれるcol番号(=わられる数の中でのけた位置。0が最上位)で突き合わせ、
   一の位(いちばん右=col番号が最大)から左へシミュレーションする。
   戻り値: [{ col, fromCol }, ...] col=くり下げてもらう位, fromCol=貸す隣(ひとつ左)の位 */
function computeBorrowColumns(step) {
  if (!step.canSub) return [];
  const colOf = id => parseInt(id.split('-').pop(), 10);

  const minuendByCol = {};
  getMinuendCellIds(step.stageIdx).forEach(id => {
    const el = document.getElementById(id);
    minuendByCol[colOf(id)] = parseInt(el && el.textContent, 10) || 0;
  });
  const productByCol = {};
  getProductCellIds(step).forEach(id => {
    const el = document.getElementById(id);
    productByCol[colOf(id)] = parseInt(el && el.textContent, 10) || 0;
  });

  const cols = Object.keys(minuendByCol).map(Number).sort((a, b) => a - b);
  let incoming = 0;   // 右どなりに1貸したことで、この位がすでに-1されているか
  const events = [];
  for (let i = cols.length - 1; i >= 0; i--) {
    const col = cols[i];
    const top = minuendByCol[col] - incoming;
    const bottom = productByCol[col] || 0;
    if (top < bottom) {
      const fromCol = cols[i - 1];
      if (fromCol !== undefined) events.push({ col, fromCol });
      incoming = 1;
    } else {
      incoming = 0;
    }
  }
  return events.reverse();  // 左(上のくらい)→右の順にしておく
}

/* v2.8.0: くり下がりの位に対応するマスidの一覧(col番号→id)を作る */
function borrowCellIdByCol(step) {
  const map = {};
  getMinuendCellIds(step.stageIdx).forEach(id => {
    map[parseInt(id.split('-').pop(), 10)] = id;
  });
  return map;
}

/* v2.8.0: 1件のくり下がりイベントぶんだけバッジを描画する。
   貸す側(fromCol): 元の数字に斜線を引き、-1した「結果の数字」を表示(例: 6→5)。
   借りる側(col)  : 「10」だけを表示(＋記号なし)。
   1つの位が「貸す」と「借りる」を両方かねるとき(連続したくり下がり)は、
   バッジが重ならないよう左上/右上に振り分ける。 */
function renderBorrowBadge(step, event, lendCols) {
  const cellIdByCol = borrowCellIdByCol(step);
  const div = document.getElementById('division');
  const cell = getCellSize();

  function badge(col, text, kind, cornerRight) {
    const cellId = cellIdByCol[col];
    const el = cellId && document.getElementById(cellId);
    if (!el) return;
    const left = parseFloat(el.style.left) || 0;
    const top  = parseFloat(el.style.top)  || 0;
    const b = document.createElement('div');
    b.className = 'borrow-mark ' + kind;
    b.dataset.borrowCol = col;
    b.style.left   = (left + (cornerRight ? cell * 0.55 : cell * 0.03)) + 'px';
    b.style.top    = (top  + cell * 0.03) + 'px';
    b.style.width  = (cell * 0.42) + 'px';
    b.style.height = (cell * 0.42) + 'px';
    b.style.fontSize = (cell * 0.24) + 'px';
    b.textContent = text;
    div.appendChild(b);
  }

  const fromEl = document.getElementById(cellIdByCol[event.fromCol]);
  const fromOriginal = fromEl ? (parseInt(fromEl.textContent, 10) || 0) : 0;
  badge(event.fromCol, String(fromOriginal - 1), 'borrow-lend', false);
  badge(event.col, '10', 'borrow-receive', lendCols.has(event.col));
}

/* v2.8.0: 「かりる」で確定ずみのイベントだけ再描画する(リサイズ後の復元用)。
   まだ確定していない位は表示しない(ボタンを押すまで見せないのがv2.8.0の設計)。 */
function renderResolvedBorrowMarks(step) {
  const c = state.current;
  if (!c || !c.hikuBorrowEvents || !c.hikuBorrowResolved || c.hikuBorrowResolved.size === 0) return;
  const lendCols = new Set(c.hikuBorrowEvents.map(e => e.fromCol));
  c.hikuBorrowEvents.forEach(ev => {
    if (c.hikuBorrowResolved.has(ev.col)) renderBorrowBadge(step, ev, lendCols);
  });
}

/* v2.8.2: 「かりる」ボタンを、筆算(ひかれる数・積)のすぐ右どなりに配置する。
   横位置: 筆算(division)の右端から少しあけた位置。ただしかけ算ワークスペースの
   実際の描画位置(実測)より手前に必ず収める(重ならない側を優先)。
   縦位置: 積の行(ひくかず)の高さ(=ひかれる数の行と、あまり行のちょうど中間)に合わせる。 */
function positionBorrowButton(step) {
  const btn = document.getElementById('borrowBtn');
  const div = document.getElementById('division');
  const panel = document.getElementById('calcPanel');
  if (!btn || !div || !panel) return;

  const cell = getCellSize();
  const divLeft = parseFloat(div.style.left) || 0;
  const divWidthPx = parseFloat(div.style.width) || 0;
  const divTop = parseFloat(div.style.top) || 0;
  const divRight = divLeft + divWidthPx;

  const margin = cell * 0.35;
  const estWidth = btn.offsetWidth || (cell * 3.2);

  // かけ算ワークスペースの実際の描画上の左端(コンテナ位置。実測で十分安全に手前に収まる)
  const ws = document.getElementById('multWorkspace');
  const wsLeft = ws ? (parseFloat(ws.style.left) || Infinity) : Infinity;

  let left = divRight + margin;                 // 理想: 筆算のすぐ右
  const maxLeft = wsLeft - estWidth - margin;    // これを超えるとワークスペースに重なる
  if (left > maxLeft) left = Math.max(divRight + cell * 0.1, maxLeft);

  // 縦位置: 積の行(ひくかず)の高さに中央を合わせる
  const productIds = getProductCellIds(step);
  const refEl = productIds[0] && document.getElementById(productIds[0]);
  const cellTop = refEl ? (parseFloat(refEl.style.top) || 0) : 0;
  const rowCenterY = divTop + cellTop + cell / 2;

  btn.style.right = 'auto';
  btn.style.left = left + 'px';
  const h = btn.offsetHeight || (cell * 0.9);
  btn.style.top = (rowCenterY - h / 2) + 'px';
}

/* v2.8.0: いま入力しようとしている位のcol番号(ひく専用、一の位から順) */
function currentHikuColumn(step) {
  const c = state.current;
  const cellIds = getInputCellIds(step);
  const id = cellIds[c.inputBuffer.length];
  return id ? parseInt(id.split('-').pop(), 10) : null;
}

/* v2.8.0: いまの位がくり下がり待ちなら numpad を止めて「かりる」ボタンを出す。
   不要なら numpad を有効にしてボタンを隠す。hiku(canSub)の間、毎回呼び出す。 */
function updateHikuBorrowGate(step) {
  const c = state.current;
  const borrowBtn = document.getElementById('borrowBtn');
  const col = currentHikuColumn(step);
  const pendingEvent = (col !== null && c.hikuBorrowEvents)
    ? c.hikuBorrowEvents.find(e => e.col === col && !c.hikuBorrowResolved.has(col))
    : null;
  const numHint = document.getElementById('numHint');
  if (pendingEvent) {
    enableNumpad(false);
    if (borrowBtn) { borrowBtn.classList.add('show'); positionBorrowButton(step); }  // v2.8.1
    if (numHint) numHint.textContent = `${placeName(c.inputBuffer.length)}は ひけないよ。「かりる」を おそう`;
  } else {
    if (borrowBtn) borrowBtn.classList.remove('show');
    enableNumpad(true);
    if (numHint) numHint.textContent = `${placeName(c.inputBuffer.length)}の こたえは？`;
  }
}

/* v2.8.0: 「かりる」ボタンのハンドラ。該当イベントのバッジを描画し、確定済みにして numpad を戻す。 */
function handleBorrowClick() {
  const c = state.current;
  if (!c || c.completed) return;
  const step = c.plan.steps[c.stepIdx];
  if (!step || step.kind !== 'hiku' || !c.stepConfirmed || !c.hikuBorrowEvents) return;
  const col = currentHikuColumn(step);
  const event = c.hikuBorrowEvents.find(e => e.col === col && !c.hikuBorrowResolved.has(col));
  if (!event) return;

  resetIdleTimer();
  const lendCols = new Set(c.hikuBorrowEvents.map(e => e.fromCol));
  renderBorrowBadge(step, event, lendCols);
  c.hikuBorrowResolved.add(col);
  updateHikuBorrowGate(step);
}

/* ---------- STEP HINT TEXT ---------- */
const STEP_NAMES_JA = { tateru:'たてる', kakeru:'かける', hiku:'ひく', herasu:'へらす', orosu:'おろす' };

function updateStepHint() {
  const c = state.current;
  if (!c) return;
  const step = c.plan.steps[c.stepIdx];
  const stepHint = document.getElementById('stepHint');
  const numHint = document.getElementById('numHint');
  document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('next'));

  if (!step) {
    stepHint.textContent = 'できた！'; numHint.textContent = 'できた！';
    return;
  }
  const isRandom = (state.mode === 'random');

  // ステップごとの説明
  if (isRandom) {
    stepHint.textContent = 'つぎの てじゅんは…?';
  } else {
    if (step.kind === 'tateru' && step.skip) stepHint.textContent = 'ここに しょうは たつかな?';
    else if (step.kind === 'tateru') stepHint.textContent = 'ゆびで かくして けんとうを つけよう';
    else if (step.kind === 'herasu') stepHint.textContent = 'ひけない…しょうを 1へらそう';
    else if (step.kind === 'kakeru') stepHint.textContent = 'みぎで かけ算を しよう';
    else if (step.kind === 'hiku') stepHint.textContent = 'ひけるかな?';
    else if (step.kind === 'orosu') stepHint.textContent = 'つぎの くらいを おろそう';
  }

  if (c.stepConfirmed) {
    const stage = c.plan.stages[step.stageIdx];
    if (step.kind === 'tateru' && step.skip) {
      numHint.textContent = `${step.partialSoFar} ÷ ${c.divisor} は たてられない → × を おそう`;
    } else if (step.kind === 'tateru' || step.kind === 'herasu') {
      numHint.textContent = `けんとうを たてよう`;
    } else if (step.kind === 'kakeru') {
      numHint.textContent = multStepHintText();
    } else if (step.kind === 'hiku') {
      // v2.7.0: 一の位から順に入力させるので、最初にその順番を案内する
      if (step.canSub) numHint.textContent = `${stage.partial} - ${step.product} は…? (${placeName(0)}から じゅんに)`;
      else numHint.textContent = `ひけない! へらすを えらぼう`;
    } else if (step.kind === 'orosu') {
      numHint.textContent = `${step.value} を おろそう`;
    }
  } else {
    numHint.textContent = 'てじゅんを えらんでね';
    if (!isRandom) {
      const btn = document.querySelector(`.step-btn[data-step="${step.kind}"]`);
      if (btn) btn.classList.add('next');
    }
  }
}

/* ---------- INPUT EXPECTATIONS ---------- */
function getExpectedDigits(step) {
  const c = state.current;
  if (step.kind === 'tateru' && step.skip) return ['×'];
  if (step.kind === 'tateru' || step.kind === 'herasu') return [String(step.value)];
  if (step.kind === 'orosu') return [String(step.value)];
  if (step.kind === 'kakeru') return String(step.value).split('');  // 積(右ワークスペース)
  if (step.kind === 'hiku') {
    if (!step.canSub) return [];
    const stage = c.plan.stages[step.stageIdx];
    // v2.7.0: 筆算の慣習(一の位から計算する)に合わせ、入力順を一の位からにする
    return String(stage.remainder).split('').reverse();
  }
  return [];
}

function getInputCellIds(step) {
  const c = state.current;
  const plan = c.plan;
  if (step.kind === 'tateru' || step.kind === 'herasu') return [`q-${step.position}`];
  if (step.kind === 'orosu') {
    const prevStage = [...plan.stages].filter(s => s.position < step.position).pop();
    if (prevStage) return [`r-${prevStage.position}-${step.position}`];
    return [`d-${step.position}`];
  }
  if (step.kind === 'kakeru') {
    // 右のワークスペースに入力(専用の入力ボックス)
    return ['mult-input'];
  }
  if (step.kind === 'hiku') {
    const stage = plan.stages[step.stageIdx];
    const len = String(stage.remainder).length;
    const startCol = stage.partialEnd - len + 1;
    const ids = [];
    for (let i = startCol; i <= stage.partialEnd; i++) ids.push(`r-${step.position}-${i}`);
    // v2.7.0: getExpectedDigits と対にして、一の位(partialEnd側)から入力させる
    return ids.reverse();
  }
  return [];
}

/* ---------- HANDLERS ---------- */
function handleStepClick(stepKind) {
  const c = state.current;
  if (!c || c.completed) return;
  const expected = c.plan.steps[c.stepIdx];
  if (!expected || c.stepConfirmed) return;
  resetIdleTimer();

  if (stepKind === expected.kind) {
    c.stepConfirmed = true;
    c.inputBuffer = [];
    armDimForStep(expected);   // たてる/へらす を押した瞬間に「使わないけた」を薄く
    if (expected.kind === 'tateru' && expected.skip) {
      // 商がたたないくらい: 指隠しはせず、× を押してもらう
      clearAllMasks();
      enableNumpad(true);
    } else if (expected.kind === 'tateru') {
      setupMaskingForTateru(expected);
      enableNumpad(true);
    } else if (expected.kind === 'herasu') {
      // v2.9.0: 「へらす」を押した瞬間に自動で1小さい商を立てる(数字入力の工程を省く)
      clearAllMasks();
      enableNumpad(false);
      const cellIds = getInputCellIds(expected);
      const qCell = document.getElementById(cellIds[0]);
      if (qCell) placeReducedQuotient(qCell, expected.value);
      c.inputBuffer = [String(expected.value)];
      advanceStep();
      return;
    } else if (expected.kind === 'kakeru') {
      clearAllMasks();
      startMultInput(expected);
      enableNumpad(true);
    } else if (expected.kind === 'hiku') {
      if (!expected.canSub) {
        // ひけない! → メッセージを出して へらす へ誘導
        enableNumpad(false);
        showCannotSubtract(expected);
        updateStepHint();
        return;  // 以降のspotlight/hint更新はスキップ(へらす誘導済み)
      } else {
        // v2.8.0: くり下がりの発生位置を計算しておく(実際のnumpad有効化はゲート判定に任せる)
        c.hikuBorrowEvents = computeBorrowColumns(expected);
        c.hikuBorrowResolved = new Set();
      }
    } else {
      enableNumpad(true);
    }
    spotlightForStep(expected);
    showHintForStep(expected);
    updateStepHint();
    if (expected.kind === 'hiku' && expected.canSub) updateHikuBorrowGate(expected);  // v2.8.0
  } else {
    const btn = document.querySelector(`.step-btn[data-step="${stepKind}"]`);
    if (btn) { btn.classList.add('wrong'); setTimeout(() => btn.classList.remove('wrong'), 600); }
    c.errorCount++;
    triggerHintAttention();
  }
}

/* ひけない場面: メッセージ + へらすボタン誘導。hikuステップを消化して次(herasu)へ */
function showCannotSubtract(step) {
  const c = state.current;
  // 該当のかけ算アイテムを rejected 表示に
  markLastMultRejected();
  const numHint = document.getElementById('numHint');
  numHint.textContent = 'ひけない! 「へらす」で しょうを 1へらそう';
  // hiku(ひけない)ステップを消化 → 次は herasu
  c.stepConfirmed = false;
  c.inputBuffer = [];
  c.stepIdx++;
  clearSpotlight();
  clearMaskables();
  updateDimUnused();
  // へらすボタンを点滅させて誘導(ランダムモードでは誘導しない)
  if (state.mode !== 'random') {
    const btn = document.querySelector('.step-btn[data-step="herasu"]');
    if (btn) btn.classList.add('next');
  }
}

/* へらす: 元の商セルに斜線、その上に「1へらした商」を小さく表示。
   連続で へらす 場合は、直前の(へらした)商に斜線を引き、さらに上へ積む。 */
function placeReducedQuotient(qCell, num) {
  const cell = getCellSize();
  const div = document.getElementById('division');
  const left = parseFloat(qCell.style.left) || 0;
  const baseTop = parseFloat(qCell.style.top) || 0;

  // この列に既にある へらした商(古い順)
  const existing = [...div.querySelectorAll(`.q-reduced[data-qreduced-for="${qCell.id}"]`)];
  if (existing.length === 0) {
    // 初回: 元の商に斜線
    qCell.classList.add('q-struck');
  } else {
    // 直前の へらした商に斜線
    existing[existing.length - 1].classList.add('q-struck');
  }
  qCell.classList.remove('spot');

  const level = existing.length + 1;   // 1段目, 2段目, ...
  const size = cell * 0.72;
  const red = document.createElement('div');
  red.className = 'q-reduced';
  red.style.left   = (left + (cell - size) / 2) + 'px';
  red.style.top    = (baseTop - cell * (0.82 * level)) + 'px';
  red.style.width  = size + 'px';
  red.style.height = size + 'px';
  red.style.fontSize = (cell * 0.6) + 'px';
  red.textContent = num;
  red.dataset.qreducedFor = qCell.id;
  div.appendChild(red);
}

function handleNumClick(num) {
  const c = state.current;
  if (!c || c.completed || !c.stepConfirmed) return;
  if (document.getElementById('numpadPanel').classList.contains('disabled')) return;  // v2.8.0: かりる待ちなどの明示ガード
  const step = c.plan.steps[c.stepIdx];
  if (!step) return;
  resetIdleTimer();

  // かける は専用の入力処理
  if (step.kind === 'kakeru') { handleMultNumInput(num); return; }

  const expected = getExpectedDigits(step);
  const cellIds = getInputCellIds(step);
  const bufIdx = c.inputBuffer.length;

  if (String(num) === expected[bufIdx]) {
    c.inputBuffer.push(String(num));
    const cellId = cellIds[bufIdx];
    const cell = document.getElementById(cellId);
    if (cell) {
      if (step.kind === 'tateru' && step.skip) {
        cell.textContent = '×';
        cell.classList.add('batsu-mark', 'correct-pop', 'fade-in');
        setTimeout(() => cell.classList.remove('correct-pop'), 500);
      } else if (step.kind === 'herasu') {
        // 元の商は消さず、斜線を引いて、1へらした商を上に表示する
        placeReducedQuotient(cell, num);
      } else if (step.kind === 'orosu') {
        cell.textContent = num;
        cell.classList.add('drop-anim');
        setTimeout(() => cell.classList.remove('drop-anim'), 700);
      } else {
        cell.textContent = num;
        cell.classList.add('correct-pop', 'fade-in');
        setTimeout(() => cell.classList.remove('correct-pop'), 500);
      }
    }
    if (c.inputBuffer.length === expected.length) {
      advanceStep();
    } else if (step.kind === 'hiku') {
      // v2.8.0: 次の位がくり下がり待ちなら numpad を止めて「かりる」ボタンを出す
      updateHikuBorrowGate(step);
    }
  } else {
    const cellId = cellIds[bufIdx];
    const cell = document.getElementById(cellId);
    if (cell) { cell.classList.add('error'); setTimeout(() => cell.classList.remove('error'), 1200); }
    const numBtn = document.querySelector(`.num-btn[data-num="${num}"]`);
    if (numBtn) { numBtn.classList.add('wrong'); setTimeout(() => numBtn.classList.remove('wrong'), 600); }
    c.errorCount++;
    triggerHintAttention();
  }
}

/* ---------- MULT WORKSPACE (かけ算を右に残す) ---------- */
/* ---------- MULT WORKSPACE: グリッドに揃えた縦ひっ算 ---------- */
/* 各試行の縦ひっ算を、背景マス目と同じピッチのマスで組み立てる。
   レイアウト(1マス1文字):
     行0:            [ ][d1][d2]   ← わる数(2桁) 右詰め
     行1:         [×][  ][ q]      ← ×仮商
     ────────── (よこ線)
     行2:         [p0][p1][p2]     ← 積(2〜3桁) 右詰め
   横は4カラム(col0=×/空, col1..3=数字3桁ぶん)。 */

function getMultLayout() {
  // かけ算ひっ算のマスサイズは「1つのときの大きさ」に固定する。
  // 試行が2つ3つと増えても縮小しない(子どもが見る数字の大きさを変えない)。
  // 入りきらないぶんは、横ならび → 折り返して段を増やす、で対応する。
  const c = state.current;
  const panel = document.getElementById('calcPanel');
  const ws = document.getElementById('multWorkspace');
  const wsW = ws.clientWidth || (panel.clientWidth * 0.4);
  const ph = panel.clientHeight;
  const baseCell = getCellSize();
  const attempts = c._multAttempts || 1;

  const ROWS_PER = 3.15;      // ひっ算1つの縦マス数(線・余白込み)
  const TITLE_ROWS = 1.1;
  const NOTE_COLS = 3.6;
  const dvLen = String(c ? c.divisor : 25).length;
  // ひっ算本体の横マス数 = × + 数字カラム(わる数けた数と積の最大けた数の大きい方)
  const BODY_COLS = 1 + Math.max(dvLen, String((c ? c.divisor : 25) * 9).length);
  const HISSAN_COLS = BODY_COLS + NOTE_COLS;   // 本体 + 「✗ひけない」ノート
  const GAP_COLS = 1;                  // ひっ算どうしの間を1マスあける
  const GAP_ROWS = 0.5;                // 段をかえたときのすき間

  // ---- マスサイズは「1つ分」だけを基準に決める(attempts に依存させない) ----
  const availW = wsW - 6;
  const availH = ph - 8;
  let mcell = Math.min(baseCell, Math.floor(availW / HISSAN_COLS));
  const needRowsOne = TITLE_ROWS + ROWS_PER + 0.5;
  if (needRowsOne * mcell > availH) mcell = Math.floor(availH / needRowsOne);
  mcell = Math.max(16, mcell);

  // ---- 配置: このサイズのまま、1段に何個ならべられるか ----
  let perRow = Math.floor((availW + GAP_COLS * mcell) / ((HISSAN_COLS + GAP_COLS) * mcell));
  if (perRow < 1) perRow = 1;
  if (perRow > attempts) perRow = attempts;

  // 段数が増えて縦にあふれる場合は、1段あたりの数を減らさず段を積む(サイズは保つ)
  const rows = Math.ceil(attempts / perRow);
  const layout = (perRow >= attempts) ? 'horizontal' : 'grid';

  return { mcell, ROWS_PER, TITLE_ROWS, HISSAN_COLS, GAP_COLS, GAP_ROWS, layout, perRow, rows };
}

function relayoutMultWorkspace() {
  // すべてのひっ算を、サイズはそのままに配置しなおす。
  // 1段に perRow 個ずつならべ、あふれたら次の段へ折り返す。
  const c = state.current;
  const ws = document.getElementById('multWorkspace');
  const { mcell, ROWS_PER, TITLE_ROWS, HISSAN_COLS, GAP_COLS, GAP_ROWS, perRow } = getMultLayout();
  c._multCell = mcell;

  const hissans = ws.querySelectorAll('.mult-hissan');
  const total = hissans.length;
  const rowsUsed = Math.ceil(total / perRow);

  // サイズは変えない方針なので、段が増えてワークスペースの高さを超えることがある。
  // その場合はグループ全体を上へずらし、いま計算中(いちばん新しい)のひっ算が
  // かならず見えるようにする。
  // ※ ws は overflow:hidden なので、はみ出した分は切れる。基準は ws 自身の高さ。
  const availH = ws.clientHeight - 4;
  const lastRowBottom =
    (TITLE_ROWS + (rowsUsed - 1) * (ROWS_PER + GAP_ROWS) + ROWS_PER_CONST + 0.35) * mcell;
  const shift = (availH > 0 && lastRowBottom > availH) ? (lastRowBottom - availH) : 0;

  const title = document.getElementById('multWsTitle');
  if (title) {
    title.style.left = '0px';
    title.style.top = '0px';
    // タイトルが上へ出てしまうときは隠す(ひっ算のじゃまをしない)
    title.style.visibility = (shift > TITLE_ROWS * mcell * 0.6) ? 'hidden' : 'visible';
  }

  hissans.forEach((h, idx) => {
    const col = idx % perRow;
    const row = Math.floor(idx / perRow);
    const leftPx = col * (HISSAN_COLS + GAP_COLS) * mcell;
    const topRow = TITLE_ROWS + row * (ROWS_PER + GAP_ROWS);
    layoutOneHissan(h, mcell, topRow * mcell - shift, leftPx);
  });
}

/* 1つのひっ算要素の内部セルを配置(mcellサイズ, 上端topPx)
   列は右=1の位。カラム構成: [× ][百][十][一] の4カラム(col0..3, 右が一の位)。
   数字カラムは右から: 一=col3, 十=col2, 百=col1。 */
const ROWS_PER_CONST = 3.4;   // くり上がり行ぶん少し高く
function layoutOneHissan(hEl, mcell, topPx, leftPx) {
  leftPx = leftPx || 0;
  const c = state.current;
  const mc = String(hEl.dataset.multiplicand);   // わる数 2桁
  const mq = String(hEl.dataset.multiplier);      // 仮商 1桁
  const prodLen = parseInt(hEl.dataset.prodLen, 10) || String(hEl.dataset.productFull).length;
  const isCurrent = (hEl.id === 'mult-current');

  const COLS = 1 + Math.max(mc.length, String(Number(mc) * 9).length);
  // col0 = ×、以降が数字カラム(右端が一の位)
  const LAST_COL = COLS - 1;
  const fontSize = mcell * 0.62;
  const carryFont = mcell * 0.34;
  hEl.style.left = leftPx + 'px';
  hEl.style.top = topPx + 'px';
  hEl.style.width = (COLS * mcell) + 'px';
  hEl.style.height = (ROWS_PER_CONST * mcell) + 'px';
  hEl.innerHTML = '';

  // 行: 0=くり上がり, 1=わる数, 2=×仮商, 3=積 (よこ線は行2と行3の間)
  const ROW_CARRY = 0, ROW_MC = 1, ROW_MQ = 2, ROW_PROD = 3;

  function put(col, row, ch, cls, fs) {
    const el = document.createElement('div');
    el.className = 'mult-cell' + (cls ? ' ' + cls : '');
    el.style.left = (col * mcell) + 'px';
    el.style.top  = (row * mcell) + 'px';
    el.style.width = mcell + 'px';
    el.style.height = mcell + 'px';
    el.style.fontSize = (fs || fontSize) + 'px';
    el.textContent = ch;
    hEl.appendChild(el);
    return el;
  }

  // 列インデックス: 一の位(prodcol 0)=最右カラム
  const colOf = pc => LAST_COL - pc;

  // 行1: わる数(けた数ぶん) 右詰め
  for (let k = 0; k < mc.length; k++) {
    put(LAST_COL - (mc.length - 1 - k), ROW_MC, mc[k]);
  }
  // 行2: × と 仮商(最右カラム=一の位そろえ)
  put(0, ROW_MQ, '×', 'op');
  put(LAST_COL, ROW_MQ, mq);
  // よこ線(行2の下)
  const line = document.createElement('div');
  line.className = 'mult-underline';
  line.style.left = (1 * mcell) + 'px';
  line.style.top  = ((ROW_MQ + 1) * mcell - 1) + 'px';
  line.style.width = ((COLS - 1) * mcell) + 'px';
  hEl.appendChild(line);

  // 行3: 積。prodcol 0(一)→ colOf。入力済みのものを表示、次のマスは枠。
  const filled = isCurrent ? (c.multFilled || {}) : null;
  const curStep = (isCurrent && c.multSteps) ? c.multSteps[c.multStepIdx] : null;
  const typing = (isCurrent && c.multTyping) ? c.multTyping : '';

  // 入力中の桁を「実際にノートに書く位置」へ振り分ける。
  //   その列の答え(cur.typed 例"18")の
  //     ・一の位(末尾) → 積の行のこの列(col)
  //     ・十の位以上(先頭側) → くり上がりとして次の列の上へ
  //   最上位カラム(isFinal)は答えを全部 積の行に書く(くり上がりにしない)。
  const typingProdMap = {};   // prodCol -> 桁 (積の行)
  const typingCarryMap = {};  // 表示するくり上がり prodCol(次の列) -> 桁
  if (curStep && typing) {
    const target = String(curStep.typed);
    const tlen = target.length;
    if (curStep.isFinal) {
      // 全部 積の行へ。ただし「実際にノートに書く位置」に最初から置く。
      // 答え target(例"63")の左からi文字目は、右から (tlen-1-i) 桁目。
      // 入力途中でも各桁を最終的な列(curStep.col + posFromRight)へ配置し、
      // 先に入力した上位桁が後から押し出されないようにする。
      for (let i = 0; i < typing.length; i++) {
        const posFromRight = tlen - 1 - i;   // 0=一の位
        typingProdMap[curStep.col + posFromRight] = typing[i];
      }
    } else {
      // 末尾桁=一の位→積の行、それ以外=くり上がり→次の列の上
      for (let i = 0; i < typing.length; i++) {
        // typing[i] は答えの左からi番目。位置(右からの桁)= tlen-1 - i ... ではなく
        // 入力は左→右なので、typingの各文字が答えのどの位かを知るには
        // 「まだ入力途中でも、最終的な位置」を使う: 答えtargetの左からi文字目は
        //   右から (tlen-1-i) 桁目 = その列からの相対位置
        const posFromRight = tlen - 1 - i;   // 0=一の位
        const ch = typing[i];
        if (posFromRight === 0) {
          typingProdMap[curStep.col] = ch;             // 一の位 → 積の行
        } else {
          // くり上がり: 次の列(col + posFromRight)の上へ
          typingCarryMap[curStep.col + posFromRight] = ch;
        }
      }
    }
  }

  const prodCols = new Set();
  for (let pc = 0; pc < prodLen; pc++) prodCols.add(pc);
  Object.keys(typingProdMap).forEach(k => prodCols.add(parseInt(k,10)));
  if (filled) Object.keys(filled).forEach(k => prodCols.add(parseInt(k,10)));
  const maxProdCol = Math.max(...prodCols, 0);

  for (let pc = 0; pc <= maxProdCol; pc++) {
    const col = colOf(pc);
    if (col < 0) continue;
    let ch = '';
    let isBlank = false, isNext = false, isTyping = false;
    if (isCurrent) {
      if (typingProdMap[pc] !== undefined) { ch = typingProdMap[pc]; isTyping = true; }
      else if (filled[pc] !== undefined) ch = String(filled[pc]);
      else { isBlank = true; if (curStep && curStep.col === pc) isNext = true; }
    } else {
      const full = String(hEl.dataset.productFull).padStart(prodLen, '0');
      ch = full[prodLen - 1 - pc];
    }
    const cls = isBlank ? 'answer-blank' : (isTyping ? 'typing' : '');
    const el = put(col, ROW_PROD, ch, cls);
    el.dataset.prodcol = pc;
    if (isNext) el.classList.add('answer-blank');
  }

  // くり上がり表示(行0)。col(=colOf(pc))の上に小さく。currentのみ。
  if (isCurrent) {
    // 確定したくり上がり
    const carryToShow = {};
    if (c.multCarries) Object.keys(c.multCarries).forEach(k => { carryToShow[k] = String(c.multCarries[k]); });
    // 入力中のくり上がり(1を先に5の上へ)
    Object.keys(typingCarryMap).forEach(k => { carryToShow[k] = typingCarryMap[k]; });
    Object.keys(carryToShow).forEach(pcStr => {
      const pc = parseInt(pcStr, 10);
      if (pc > maxProdCol + 1) return;
      const col = colOf(pc);
      if (col < 0) return;
      const isTypingCarry = (typingCarryMap[pc] !== undefined);
      put(col, ROW_CARRY, carryToShow[pc], isTypingCarry ? 'carry typing-carry' : 'carry', carryFont);
    });
  }

  if (hEl.classList.contains('rejected')) {
    addStrike(hEl, mcell, prodLen);
    addNote(hEl, mcell, '✗ ひけない', COLS, ROW_PROD);
  }
  // v2.8.3: 正解時の「✓ これだ!」注記は「せいかい!」表示と重なって煩雑だったため削除
}

function addStrike(hEl, mcell, prodLen) {
  const startCol = 4 - prodLen;
  const strike = document.createElement('div');
  strike.className = 'mult-strike';
  strike.style.left = (startCol * mcell + mcell*0.05) + 'px';
  strike.style.top  = (3.5 * mcell) + 'px';
  strike.style.width = (prodLen * mcell - mcell*0.1) + 'px';
  hEl.appendChild(strike);
}
function addNote(hEl, mcell, text, COLS, prodRow) {
  const note = document.createElement('div');
  note.className = 'mult-note';
  note.textContent = text;
  note.style.left = (COLS * mcell + mcell*0.1) + 'px';
  note.style.top  = (prodRow * mcell + mcell*0.1) + 'px';
  note.style.fontSize = (mcell * 0.42) + 'px';
  hEl.appendChild(note);
}

/* かけ算ひっ算の「1の位から」入力手順を作る。
   わる数(2桁) × 仮商(1桁)。列ごとに、その列の「かけ算の答え」を丸ごと入力する。
     一の位: 9×2=18 → 「18」と入力。一の位に 8、くり上がり 1 は十の位(5)の上へ。
     十の位: 5×2＋1=11 → 「11」と入力。最後の位なので 11 をそのまま(十の位に1,百の位に1)。
   返り値: { entries:[{col, typed, placedDigit, carry, isFinal, factorDigit, incomingCarry}], prodLen }
     col … 一=0, 十=1 (その列に「答えの一の位」が入る)
     typed … 子どもが入力する数(その列のかけ算の答え。文字列)
     placedDigit … その列に残す1桁
     carry … 次の列の上に表示するくり上がり(数、0ならなし)
     isFinal … 最上位カラム(くり上がりも書き出す) */
function computeMultSteps(divisor, q) {
  // わる数のけた数ぶん、右(一の位)から順にカラムを作る。
  // 2けた(23)なら2カラム、3けた(216)なら3カラム。
  const ds = String(divisor).split('').map(Number);
  const nCols = ds.length;
  const entries = [];
  let carry = 0;

  for (let col = 0; col < nCols; col++) {
    const factorDigit = ds[nCols - 1 - col];   // 右から col 番目のけた
    const incomingCarry = carry;
    const p = factorDigit * q + incomingCarry;
    const isFinal = (col === nCols - 1);
    carry = Math.floor(p / 10);
    entries.push({
      col,
      typed: String(p),
      placedDigit: p % 10,
      carry,
      isFinal,
      factorDigit,
      incomingCarry
    });
  }

  const prodLen = String(divisor * q).length;
  return { entries, prodLen };
}

/* カラム番号 → 位の名前(子ども向け) */
const PLACE_NAMES = ['一', '十', '百', '千'];
function placeName(col) { return (PLACE_NAMES[col] || '') + 'のくらい'; }

/* いま入力すべき列の計算をヒント表示 */
function multStepHintText() {
  const c = state.current;
  if (!c.multSteps || !c.multSteps[c.multStepIdx]) return 'かけ算しよう';
  const cur = c.multSteps[c.multStepIdx];
  const q = parseInt(document.getElementById('mult-current')?.dataset.multiplier, 10);
  const name = placeName(cur.col);
  if (cur.incomingCarry) {
    return `${name}: ${cur.factorDigit} × ${q} ＋ ${cur.incomingCarry} は…?`;
  }
  return `${name}: ${cur.factorDigit} × ${q} は…?`;
}

function startMultInput(step) {
  const c = state.current;
  const ws = document.getElementById('multWorkspace');
  if (!document.getElementById('multWsTitle')) {
    const title = document.createElement('div');
    title.className = 'mult-ws-title';
    title.id = 'multWsTitle';
    title.textContent = '✖️ かけ算の ひっ算';
    ws.appendChild(title);
  }
  c._multAttempts = (c._multAttempts || 0) + 1;

  const msteps = computeMultSteps(c.divisor, step.qForMult);
  const item = document.createElement('div');
  item.className = 'mult-hissan newpop';
  item.id = 'mult-current';
  item.dataset.multiplicand = String(c.divisor);
  item.dataset.multiplier = String(step.qForMult);
  item.dataset.productFull = String(step.value);
  item.dataset.prodLen = String(msteps.prodLen);
  ws.appendChild(item);

  // 入力状態: 列ごとに「その列のかけ算の答え」を丸ごと入力する
  c.multSteps = msteps.entries;
  c.multStepIdx = 0;
  c.multFilled = {};              // prodCol -> 確定した1桁
  c.multCarries = {};             // prodCol -> その列の上に出すくり上がり(文字列/数)
  c.multTyping = '';              // いま入力中の桁(その列の答えを組み立て中)

  relayoutMultWorkspace();
  setTimeout(() => item.classList.remove('newpop'), 400);
}

function handleMultNumInput(num) {
  const c = state.current;
  const item = document.getElementById('mult-current');
  if (!item || !c.multSteps) return;
  const cur = c.multSteps[c.multStepIdx];
  if (!cur) return;

  const typed = c.multTyping + String(num);
  const target = String(cur.typed);

  // 入力中の桁が、答えの先頭一致になっているか(前方一致)チェック
  if (target.startsWith(typed)) {
    c.multTyping = typed;
    // 途中表示: いま入力中の数を現在の列セルに仮表示
    relayoutMultWorkspace();
    const cell = item.querySelector(`.mult-cell[data-prodcol="${cur.col}"]`);
    if (cell) { cell.classList.add('correct-pop'); setTimeout(()=>cell.classList.remove('correct-pop'),350); }

    if (typed === target) {
      // その列の答えが完成 → 位に振り分け
      commitMultColumn(cur);
      c.multTyping = '';
      c.multStepIdx++;
      relayoutMultWorkspace();
      if (c.multStepIdx >= c.multSteps.length) {
        finalizeMultItem();
        // かけ算の答えを わり算のひっ算(積の行)へ転記(アニメーション)してから ひくへ
        transcribeProductToDivision(() => advanceStep());
      } else {
        const numHint = document.getElementById('numHint');
        if (numHint) numHint.textContent = multStepHintText();
      }
    }
  } else {
    const cell = item.querySelector(`.mult-cell[data-prodcol="${cur.col}"]`);
    if (cell) { cell.classList.add('error'); setTimeout(()=>cell.classList.remove('error'),1000); }
    const numBtn = document.querySelector(`.num-btn[data-num="${num}"]`);
    if (numBtn) { numBtn.classList.add('wrong'); setTimeout(() => numBtn.classList.remove('wrong'), 600); }
    c.multTyping = '';   // 入力やり直し
    relayoutMultWorkspace();
    c.errorCount++;
    triggerHintAttention();
  }
}

/* 完成した列の答えを、位(マス)とくり上がりに振り分ける */
function commitMultColumn(cur) {
  const c = state.current;
  if (!cur.isFinal) {
    // 一の位など: 一の位の桁を残し、残り(くり上がり)は次の列の上へ
    c.multFilled[cur.col] = cur.placedDigit;
    if (cur.carry > 0) c.multCarries[cur.col + 1] = cur.carry;
  } else {
    // 最上位: 答えを全部書き出す(例 11 → 十の位1, 百の位1)
    const digits = String(cur.typed).split('').map(Number); // 例 [1,1]
    // 右から順に col, col+1, ... へ
    for (let i = 0; i < digits.length; i++) {
      const prodCol = cur.col + i;
      c.multFilled[prodCol] = digits[digits.length - 1 - i];
    }
    // 最上位カラムに入っていたくり上がり表示は、書き出したので消す
    if (c.multCarries[cur.col] !== undefined) delete c.multCarries[cur.col];
  }
}

function finalizeMultItem() {
  const item = document.getElementById('mult-current');
  if (!item) return;
  item.dataset.finalized = '1';
  item.id = '';
  relayoutMultWorkspace();
}

/* かけ算の答えを わり算のひっ算の「積の行(p-)」へ転記する。
   右のかけ算ひっ算の各桁が、対応する p- マスへ飛んでいくアニメーション。 */
function transcribeProductToDivision(done) {
  const c = state.current;
  const step = c.plan.steps[c.stepIdx];        // いまの kakeru ステップ
  if (!step || step.kind !== 'kakeru') { if (done) done(); return; }
  const stage = c.plan.stages[step.stageIdx];
  const div = document.getElementById('division');
  const cell = getCellSize();
  const prodStr = String(step.value);          // 例 "648"
  const prodLen = prodStr.length;

  // 直近に確定した(=右の)かけ算ひっ算を取得
  const ws = document.getElementById('multWorkspace');
  const hissans = ws.querySelectorAll('.mult-hissan');
  const lastH = hissans[hissans.length - 1];

  // v2.8.4: へらしたあとの転記で、前の(たてすぎた)積の桁が残らないように積の行をクリア
  clearProductRow(stage);

  // 転記先の p- マスをハイライト(赤枠)。startCol は負(左へはみ出し)になることがある。
  const startCol = stage.partialEnd - prodLen + 1;
  showProductRowHighlight(step.position, startCol, prodLen, cell);
  // 引き算の線も、はみ出したぶんだけ左へのばす
  adjustSubLine(step.position, startCol, cell);

  // 各桁ごとに飛ぶ数字を作る
  const divRect = div.getBoundingClientRect();
  // ステージ全体が transform: scale されているため、実測値をデザイン座標へ戻す
  const SS = window.__stageScale || 1;
  let landed = 0;
  const totalToLand = prodLen;

  for (let pc = 0; pc < prodLen; pc++) {
    // かけ算ひっ算側のソースセル(data-prodcol=pc)
    const srcCell = lastH ? lastH.querySelector(`.mult-cell[data-prodcol="${pc}"]`) : null;
    // 転記先: partialEnd から左へ。負になったら はみ出しマス(ov)。
    const destCol = stage.partialEnd - pc;
    const destId = prodCellId(step.position, destCol);
    const destCell = document.getElementById(destId);
    if (!srcCell || !destCell) { landed++; continue; }

    const srcRect = srcCell.getBoundingClientRect();
    // 飛ぶ数字(divのローカル座標)
    const fly = document.createElement('div');
    fly.className = 'fly-digit';
    fly.textContent = prodStr[prodLen - 1 - pc];
    fly.style.width = cell + 'px';
    fly.style.height = cell + 'px';
    fly.style.fontSize = (cell * 0.68) + 'px';
    // 開始位置(div基準)
    const startLeft = (srcRect.left - divRect.left) / SS + (srcRect.width / SS - cell)/2;
    const startTop  = (srcRect.top  - divRect.top ) / SS + (srcRect.height / SS - cell)/2;
    fly.style.left = startLeft + 'px';
    fly.style.top  = startTop + 'px';
    fly.style.transform = 'scale(1)';
    div.appendChild(fly);

    // 目標位置(p-セルの座標)
    const destLeft = parseFloat(destCell.style.left);
    const destTop  = parseFloat(destCell.style.top);

    // 少し時間差で飛ばす(一の位から)
    const delay = 120 + pc * 130;
    requestAnimationFrame(() => {
      setTimeout(() => {
        fly.style.left = destLeft + 'px';
        fly.style.top  = destTop + 'px';
      }, delay);
    });
    // 着地
    setTimeout(() => {
      destCell.textContent = prodStr[prodLen - 1 - pc];
      destCell.classList.add('copy-land');
      setTimeout(() => destCell.classList.remove('copy-land'), 400);
      fly.remove();
      landed++;
      if (landed >= totalToLand) {
        // 全部着地 → 引き算の線を出して次へ
        const sub = document.getElementById(`subline-${step.position}`);
        if (sub) sub.style.display = 'block';
        setTimeout(() => {
          hideProductRowHighlight();
          if (done) done();
        }, 250);
      }
    }, delay + 560);
  }

  if (totalToLand === 0 && done) done();
}

/* v2.8.4: 積の行(はみ出しマスも含む)をまっさらにする */
function clearProductRow(stage) {
  const c = state.current;
  for (let i = 0; i < c.n; i++) {
    const el = document.getElementById(`p-${stage.position}-${i}`);
    if (el) el.textContent = '';
  }
  const ovMax = productOverflowCols(stage);
  for (let k = 1; k <= ovMax; k++) {
    const el = document.getElementById(prodCellId(stage.position, -k));
    if (el) el.textContent = '';
  }
}

/* v2.8.4: 引き算の線を、積のはみ出しに合わせてのばす/もどす */
function adjustSubLine(position, startCol, cell) {
  const c = state.current;
  const sub = document.getElementById(`subline-${position}`);
  if (!sub) return;
  const FIRST = String(c.divisor).length;
  const over = Math.max(0, -startCol);          // 左へはみ出したマス数
  sub.style.left  = ((FIRST - over) * cell) + 'px';
  sub.style.width = ((c.n + over) * cell) + 'px';
}

function showProductRowHighlight(position, startCol, prodLen, cell) {
  hideProductRowHighlight();
  const div = document.getElementById('division');
  const c = state.current;
  const FIRST = String(c.divisor).length;
  const stage = c.plan.stages.find(s => s.position === position);
  const productRow = 2 + c.plan.stages.indexOf(stage) * 2;
  const hl = document.createElement('div');
  hl.className = 'p-row-highlight';
  hl.id = 'pRowHighlight';
  hl.style.left = ((FIRST + startCol) * cell - 2) + 'px';
  hl.style.top  = (productRow * cell - 2) + 'px';
  hl.style.width = (prodLen * cell + 4) + 'px';
  hl.style.height = (cell + 4) + 'px';
  div.appendChild(hl);
  requestAnimationFrame(() => hl.classList.add('show'));
}
function hideProductRowHighlight() {
  const hl = document.getElementById('pRowHighlight');
  if (hl) { hl.classList.remove('show'); setTimeout(() => hl.remove(), 300); }
}

/* ひけないかけ算に 取り消し線 */
function markLastMultRejected() {
  const ws = document.getElementById('multWorkspace');
  const items = ws.querySelectorAll('.mult-hissan');
  if (items.length === 0) return;
  const last = items[items.length - 1];
  last.classList.add('rejected');
  relayoutMultWorkspace();
}
/* ひけたかけ算に ✓ */
function markLastMultAccepted() {
  const ws = document.getElementById('multWorkspace');
  const items = ws.querySelectorAll('.mult-hissan');
  if (items.length === 0) return;
  const last = items[items.length - 1];
  last.classList.add('accepted');
  relayoutMultWorkspace();
}

/* ---------- ADVANCE ---------- */
function advanceStep() {
  const c = state.current;
  const doneStep = c.plan.steps[c.stepIdx];

  // ひく成功時: かけ算アイテムに✓、subline表示
  if (doneStep && doneStep.kind === 'hiku' && doneStep.canSub) {
    markLastMultAccepted();
    const sub = document.getElementById(`subline-${doneStep.position}`);
    if (sub) sub.style.display = 'block';
  }

  c.stepConfirmed = false;
  c.inputBuffer = [];
  c.stepIdx++;
  enableNumpad(false);
  clearSpotlight();
  clearMaskables();

  if (c.stepIdx >= c.plan.steps.length) {
    c.completed = true;
    if (c.errorCount <= 1) state.correctCount++;
    document.getElementById('correctDisplay').textContent = state.correctCount;
    clearIdleTimer();
    clearDimUnused();
    showRemainderTag();
    showCorrectMark();
  } else {
    updateDimUnused();
    updateStepHint();
  }
}

function showRemainderTag() {
  const c = state.current;
  if (!c || c.plan.remainder === 0) return;
  const div = document.getElementById('division');
  const cell = getCellSize();
  const lastStage = c.plan.stages[c.plan.stages.length - 1];
  const FIRST_DIGIT_COL = String(c.divisor).length;
  // 最終あまり行の下に「あまり N」を置く(ひっ算の内側・ワークスペースと重ならない)
  const remRow = 3 + (c.plan.stages.length - 1) * 2;
  const tag = document.createElement('div');
  tag.className = 'remainder-tag';
  tag.innerHTML = `<span class="label">あまり</span><span class="value">${c.plan.remainder}</span>`;
  tag.style.left = (FIRST_DIGIT_COL * cell) + 'px';
  tag.style.top  = ((remRow + 1) * cell + cell * 0.05) + 'px';
  div.appendChild(tag);
}

/* ---------- CORRECT MARK ---------- */
function showCorrectMark() {
  const maru = document.getElementById('bigMaru');
  const nextBtn = document.getElementById('nextQBtn');
  maru.style.display = 'flex';
  positionCorrectMark();
  const wrap = maru.querySelector('.maru-svg-wrap');
  if (wrap) { wrap.style.animation = 'none'; void wrap.offsetWidth; wrap.style.animation = 'maruDraw 0.6s cubic-bezier(0.34, 1.2, 0.64, 1) forwards'; }
  const circle = maru.querySelector('circle');
  if (circle) { circle.style.animation = 'none'; void circle.offsetWidth; circle.style.animation = 'maruStroke 0.7s ease-out forwards'; }
  const seikai = maru.querySelector('.seikai-text');
  if (seikai) { seikai.style.animation = 'none'; void seikai.offsetWidth; seikai.style.animation = 'textPop 0.4s 0.6s forwards'; }
  nextBtn.style.animation = 'none'; void nextBtn.offsetWidth; nextBtn.style.animation = 'nextBtnIn 0.5s 0.8s both';
  nextBtn.classList.add('show');
  nextBtn.onclick = goNextQuestion;
}

function positionCorrectMark() {
  const maru = document.getElementById('bigMaru');
  const wrap = maru.querySelector('.maru-svg-wrap');
  const panel = document.getElementById('calcPanel');
  const division = document.getElementById('division');
  if (!maru || !wrap || !panel || !division) return;
  const pw = panel.clientWidth, ph = panel.clientHeight;
  const divLeft = parseFloat(division.style.left)||0, divTop = parseFloat(division.style.top)||0;
  const divWidth = parseFloat(division.style.width)||0, divHeight = parseFloat(division.style.height)||0;
  const divBottom = divTop + divHeight;
  const PAD = 12;
  // 「つぎの もんだいへ」ボタンのぶんを先に確保する(赤丸や「せいかい」と重ならないように)
  const nextBtnEl = document.getElementById('nextQBtn');
  let btnH = 56;
  if (nextBtnEl) {
    const prevD = nextBtnEl.style.display, prevV = nextBtnEl.style.visibility;
    nextBtnEl.style.visibility = 'hidden'; nextBtnEl.style.display = 'block';
    btnH = nextBtnEl.offsetHeight || 56;
    nextBtnEl.style.display = prevD; nextBtnEl.style.visibility = prevV;
  }
  const reserveBottom = btnH + PAD * 2;
  const belowH = Math.max(0, ph - divBottom - reserveBottom);
  const belowSize = Math.min(pw * 0.7, Math.max(0, belowH - PAD * 2));

  maru.style.inset = 'auto';
  maru.style.justifyContent = 'center';
  maru.style.alignItems = 'center';

  let boxLeft, boxTop, boxW, boxH, size;
  if (belowSize >= 80) {
    size = belowSize; boxW = pw; boxH = belowH; boxLeft = 0; boxTop = divBottom;
  } else {
    boxH = Math.max(100, ph - reserveBottom);
    size = Math.min(pw, boxH) * 0.45; boxW = pw; boxLeft = 0; boxTop = 0;
  }

  // 「せいかい!」の文字は置き場所の幅に合わせて縮める(はみ出し防止)
  const seikaiEl = maru.querySelector('.seikai-text');
  if (seikaiEl) seikaiEl.style.fontSize = Math.max(16, Math.min(38, boxW / 8)) + 'px';
  maru.style.left = boxLeft + 'px'; maru.style.top = boxTop + 'px';
  maru.style.width = boxW + 'px'; maru.style.height = boxH + 'px';
  const circleSize = Math.max(60, size * 0.75);
  wrap.style.width = circleSize + 'px'; wrap.style.height = circleSize + 'px';
  wrap.style.maxWidth = '90%'; wrap.style.maxHeight = '70%';

  if (nextBtnEl) {
    let btnTop = ph - btnH - PAD;
    if (btnTop < PAD) btnTop = PAD;
    nextBtnEl.style.bottom = 'auto'; nextBtnEl.style.top = btnTop + 'px';
  }
}

function goNextQuestion() {
  resetMarkAndButtons();
  state.qIdx++;
  if (state.qIdx >= state.questions.length) showResults();
  else loadQuestion();
}
function resetMarkAndButtons() {
  const maru = document.getElementById('bigMaru');
  const nextBtn = document.getElementById('nextQBtn');
  maru.style.display = 'none';
  nextBtn.classList.remove('show');
  maru.style.left=''; maru.style.top=''; maru.style.width=''; maru.style.height=''; maru.style.inset='';
  nextBtn.style.top=''; nextBtn.style.bottom='';
}

/* ---------- NUMPAD ---------- */
function enableNumpad(on) {
  const pad = document.getElementById('numpadPanel');
  if (on) pad.classList.remove('disabled');
  else pad.classList.add('disabled');
}

/* ---------- LOAD QUESTION ---------- */
function loadQuestion() {
  const q = state.questions[state.qIdx];
  const dividend = q[0], divisor = q[1];
  const srcLv = (q[2] !== undefined) ? q[2] : state.level;
  const plan = buildPlan(dividend, divisor);
  state.current = {
    dividend, divisor, plan, digits: plan.digits, n: plan.n, srcLv,
    stepIdx: 0, stepConfirmed: false, inputBuffer: [], multBuffer: [], multExpected: '',
    dimArmedCol: null,
    errorCount: 0, completed: false, hintRequested: false
  };
  document.getElementById('qNumDisplay').textContent = state.qIdx + 1;
  document.getElementById('qTotalDisplay').textContent = state.questions.length;
  // ワークスペースをクリア
  document.getElementById('multWorkspace').innerHTML = '';
  shuffleStepButtons(state.mode === 'random');
  updateCalcHintButton();
  renderDivision();
  updateDimUnused();
  updateStepHint();
  enableNumpad(false);
  clearSpotlight();
  clearAllMasks();
  resetIdleTimer();
}

/* v2.10.0: ヒントボタンを削除したため、旧ボタンの表示更新/アイドル誘導は不要になった。
   呼び出し箇所はそのまま残してあるが、どちらも何もしない。 */
function updateCalcHintButton() {}
function resetIdleTimer() {}
function clearIdleTimer() {}
function triggerHintAttention() {}

/* ---------- STEP BUTTON SHUFFLE ---------- */
function shuffleStepButtons(shouldShuffle) {
  const grid = document.getElementById('stepGrid');
  if (!grid) return;
  const buttons = grid.querySelectorAll('.step-btn');
  if (!shouldShuffle) { buttons.forEach(b => b.style.order = ''); return; }
  const order = [0,1,2,3,4];
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  buttons.forEach((btn, idx) => btn.style.order = order[idx]);
}

/* ---------- BUILD QUESTION SET ---------- */
function buildQuestionSet() {
  const lvl = LEVELS[state.level];
  if (lvl.isChallenge) {
    buildChallengeSet(lvl);
    state.qIdx = 0; state.correctCount = 0;
    document.getElementById('correctDisplay').textContent = 0;
    document.getElementById('levelDisplay').textContent = lvl.badge || '★';
    return;
  }
  if (state.mode === 'fixed') {
    state.questions = lvl.fixed.slice(0, QUESTIONS_PER_LEVEL).map(q => [q[0], q[1], state.level]);
  } else {
    state.questions = [];
    const seen = new Set();
    let guard = 0;
    while (state.questions.length < QUESTIONS_PER_LEVEL && guard < 500) {
      guard++;
      // 何問目(0始まり)を生成中かを渡す(レベル2の3問目/5問目のような
      // 「出題順に応じた条件」を randomGen 側で使えるようにするため)
      const q = lvl.randomGen(state.questions.length);
      const key = q.join(',');
      if (!seen.has(key)) { seen.add(key); state.questions.push([q[0], q[1], state.level]); }
    }
  }
  state.qIdx = 0; state.correctCount = 0;
  document.getElementById('correctDisplay').textContent = 0;
  document.getElementById('levelDisplay').textContent = lvl.badge || state.level;
}

function buildChallengeSet(lvl) {
  const sources = lvl.mixFrom;
  state.questions = [];
  const seen = new Set();
  if (state.mode === 'fixed') {
    const pool = [];
    for (const lv of sources) for (const q of LEVELS[lv].fixed) pool.push([q[0], q[1], lv]);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    for (const item of pool) {
      const key = item.join(',');
      if (seen.has(key)) continue;
      seen.add(key); state.questions.push(item);
      if (state.questions.length >= QUESTIONS_PER_LEVEL) break;
    }
  } else {
    let guard = 0;
    while (state.questions.length < QUESTIONS_PER_LEVEL && guard < 500) {
      guard++;
      const lv = sources[Math.floor(Math.random()*sources.length)];
      const q = LEVELS[lv].randomGen();
      const key = q[0]+','+q[1]+','+lv;
      if (seen.has(key)) continue;
      seen.add(key); state.questions.push([q[0], q[1], lv]);
    }
  }
}

/* ---------- SCREENS ---------- */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setupTitleScreen() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  const LEVEL_COUNT = Object.keys(LEVELS).length;
  for (let i = 1; i <= LEVEL_COUNT; i++) {
    const lvl = LEVELS[i];
    const card = document.createElement('button');
    card.className = 'level-card';
    if (lvl.isChallenge) card.classList.add('challenge');
    card.dataset.level = i;
    const badge = lvl.badge || String(i);
    const topLabel = lvl.isChallenge ? 'CHALLENGE' : 'LEVEL';
    card.innerHTML = `
      <div class="lv-num"><small>${topLabel}</small>${badge}</div>
      <div class="lv-title">${lvl.title}</div>
      <div class="lv-desc">${lvl.desc.replace('\n','<br>')}</div>`;
    card.onclick = () => {
      document.querySelectorAll('.level-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      state.level = i;
      updateStartBtn();
    };
    grid.appendChild(card);
  }
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected'); state.mode = btn.dataset.mode;
    };
  });
  document.getElementById('startBtn').onclick = () => {
    if (!state.level) return;
    buildQuestionSet();
    showScreen('mainScreen');
    requestAnimationFrame(() => loadQuestion());
  };
}
function updateStartBtn() { document.getElementById('startBtn').disabled = !state.level; }

/* ---------- RESULT ---------- */
function showResults() {
  showScreen('resultScreen');
  const correct = state.correctCount, total = state.questions.length;
  document.getElementById('resultCorrect').textContent = correct;
  document.getElementById('resultTotal').textContent = total;
  const pct = correct / total;
  let emoji, title, msg;
  if (pct === 1) { emoji='🏆'; title='パーフェクト！'; msg='すごい！ぜんもん せいかい だよ！'; }
  else if (pct >= 0.8) { emoji='🌟'; title='よくできました！'; msg='もう ちょっとで パーフェクト！'; }
  else if (pct >= 0.5) { emoji='😊'; title='がんばったね！'; msg='この ちょうしで れんしゅう しよう！'; }
  else { emoji='💪'; title='もう いっかい!'; msg='まちがえても だいじょうぶ！れんしゅう が だいじ！'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg;
  if (pct >= 0.8) launchConfetti();
}
function launchConfetti() {
  const container = document.getElementById('confetti');
  container.innerHTML = '';
  const colors = ['#f08a3e','#4a90c8','#5a9f6b','#f5c842','#e85a4f','#8a6fb0'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (2 + Math.random()*2) + 's';
    piece.style.animationDelay = Math.random()*0.8 + 's';
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    if (Math.random() > 0.5) piece.style.borderRadius = '50%';
    container.appendChild(piece);
  }
  setTimeout(() => container.innerHTML = '', 5000);
}

/* ---------- MAIN SCREEN WIRING ---------- */
function setupMainScreen() {
  document.querySelectorAll('.step-btn').forEach(btn => { btn.onclick = () => handleStepClick(btn.dataset.step); });
  document.querySelectorAll('.num-btn').forEach(btn => {
    btn.onclick = () => {
      const raw = btn.dataset.num;
      handleNumClick(raw === '×' ? '×' : parseInt(raw, 10));
    };
  });
  const borrowBtn = document.getElementById('borrowBtn');
  if (borrowBtn) borrowBtn.onclick = handleBorrowClick;  // v2.8.0
  document.getElementById('skipBtn').onclick = () => {
    if (!state.current || state.current.completed) return;
    clearIdleTimer(); resetMarkAndButtons();
    state.qIdx++;
    if (state.qIdx >= state.questions.length) showResults();
    else loadQuestion();
  };
  document.getElementById('backBtn').onclick = () => {
    if (confirm('タイトルへ もどりますか？ いまの もんだいは リセットされます。')) {
      resetMarkAndButtons(); clearIdleTimer(); showScreen('titleScreen');
    }
  };
}
function setupResultScreen() {
  document.getElementById('resultHomeBtn').onclick = () => showScreen('titleScreen');
  document.getElementById('resultRetryBtn').onclick = () => {
    buildQuestionSet(); showScreen('mainScreen'); requestAnimationFrame(() => loadQuestion());
  };
}

/* ---------- RESIZE ---------- */
let resizeTimer = null;
function handleResize() {
  if (!state.current) return;
  if (!document.getElementById('mainScreen').classList.contains('active')) return;
  if (state.current.completed) {
    if (document.getElementById('bigMaru').style.display === 'flex') positionCorrectMark();
    return;
  }
  // 簡易再描画(入力途中の完全復元は今回は省略、位置のみ追従)
  renderDivision();
  updateDimUnused();
  const step = state.current.plan.steps[state.current.stepIdx];
  if (step && state.current.stepConfirmed) {
    spotlightForStep(step); showHintForStep(step);
    if (step.kind === 'tateru' || step.kind === 'herasu') setupMaskingForTateru(step);
    if (step.kind === 'hiku' && step.canSub) updateHikuBorrowGate(step);  // v2.8.0
  }
}
window.addEventListener('resize', () => { if (resizeTimer) clearTimeout(resizeTimer); resizeTimer = setTimeout(handleResize, 120); });
window.addEventListener('orientationchange', () => { if (resizeTimer) clearTimeout(resizeTimer); resizeTimer = setTimeout(handleResize, 220); });
