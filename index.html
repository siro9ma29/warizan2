<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わりざんのひっ算れんしゅうⅡ 〜2けたでわる〜</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap');

  :root {
    --paper:       #fbf8f0;
    --paper-2:     #f5f0e1;
    --ink:         #2c3a4a;
    --ink-soft:    #5a6878;
    --grid:        #9dd4dc;
    --grid-soft:   #cfeaee;
    --line:        #c8d2dc;
    --accent:      #f08a3e;
    --accent-2:    #e85a4f;
    --green:       #5a9f6b;
    --blue:        #4a90c8;
    --purple:      #8a6fb0;
    --yellow:      #f5c842;
    --maru-red:    #e63946;
    --mask:        #4a5568;      /* 指隠しのマスク色 */
    --dim-alpha:   0.2;          /* けんとうに使わないけたの薄さ(0=見えない 1=ふつう) */
    --shadow:      rgba(44, 58, 74, 0.12);
    --shadow-deep: rgba(44, 58, 74, 0.25);

    --font-display: 'Zen Maru Gothic', sans-serif;
    --font-hand:    'Klee One', 'Zen Maru Gothic', cursive;
    --font-ui:      'Kosugi Maru', sans-serif;

    --cell: 58px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--paper);
    user-select: none;
  }
  body {
    background-image:
      radial-gradient(circle at 20% 10%, rgba(245, 200, 66, 0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(74, 144, 200, 0.08), transparent 40%);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  .screen { position: fixed; inset: 0; display: none; }
  .screen.active { display: flex; }

  /* ============ TITLE SCREEN ============ */
  #titleScreen {
    flex-direction: column; align-items: center; justify-content: center;
    padding: 3cqh 4cqw; gap: 2.5cqh;
  }
  .title-header { text-align: center; position: relative; width: 100%; }
  .app-title {
    font-family: var(--font-display); font-weight: 900;
    font-size: 50px;
    color: var(--ink); letter-spacing: 0.06em;
  }
  .app-title .accent { color: var(--accent); }
  .app-title .badge2 {
    display: inline-block; background: var(--purple); color: white;
    font-size: 0.5em; border-radius: 999px; padding: 0.15em 0.7em;
    vertical-align: middle; margin-left: 0.3em; letter-spacing: 0.05em;
  }
  .app-subtitle {
    font-family: var(--font-hand);
    font-size: 20px;
    color: var(--ink-soft); margin-top: 0.5em;
  }
  .version-badge {
    display: inline-flex; align-items: center; gap: 0.35em;
    font-family: var(--font-display); font-weight: 700;
    font-size: 15px;
    color: var(--ink-soft); background: white;
    border: 1.5px solid var(--line); border-radius: 999px;
    padding: 0.25em 0.85em; margin-top: 1.2cqh;
    box-shadow: 0 2px 0 var(--line); letter-spacing: 0.04em;
  }
  .version-badge .dot {
    width: 0.5em; height: 0.5em; border-radius: 50%;
    background: var(--green); display: inline-block;
  }
  .version-badge .vnum { color: var(--accent); font-weight: 900; }
  /* メイン画面のミニ版バッヂ */
  .pill.version-pill {
    font-size: 15px;
    color: var(--ink-soft); border-style: dashed;
  }
  .pill.version-pill .vnum { color: var(--accent); font-weight: 900; }
  .section-label {
    font-family: var(--font-display); font-weight: 700;
    font-size: 20px;
    color: var(--ink-soft); margin-bottom: 0.8cqh;
    text-align: center; letter-spacing: 0.05em;
  }
  .section-label .deco { color: var(--accent); }

  .level-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1.2cqw; width: 82cqw; max-width: 900px;
  }
  .level-card {
    background: white; border: 2px solid var(--line);
    border-radius: 1.2cqw; padding: 2cqh 0.8cqw;
    text-align: center; transition: all 0.2s ease;
    box-shadow: 0 4px 0 var(--line);
    min-height: 17cqh;
    display: flex; flex-direction: column; justify-content: center; gap: 0.6cqh;
  }
  .level-card:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
  .level-card.selected {
    border-color: var(--accent); box-shadow: 0 4px 0 var(--accent); background: #fff8ef;
  }
  .level-card .lv-num {
    font-family: var(--font-display); font-weight: 900;
    font-size: 34px;
    color: var(--accent); line-height: 1;
  }
  .level-card .lv-num small {
    font-size: 0.42em; color: var(--ink-soft);
    display: block; font-weight: 700; margin-bottom: 0.3em; letter-spacing: 0.05em;
  }
  .level-card .lv-title {
    font-family: var(--font-display); font-weight: 700;
    font-size: 19px; color: var(--ink);
  }
  .level-card .lv-desc {
    font-family: var(--font-hand);
    font-size: 16px;
    color: var(--ink-soft); line-height: 1.4;
  }
  .level-card.challenge .lv-num { color: #e0a020; }
  .level-card.challenge {
    background: linear-gradient(160deg, #fffdf5, #fff6e0);
    border-color: var(--yellow); box-shadow: 0 4px 0 var(--yellow);
  }
  .level-card.challenge.selected {
    border-color: #e0a020; box-shadow: 0 4px 0 #e0a020;
    background: linear-gradient(160deg, #fffaf0, #ffeec0);
  }

  .mode-row { display: flex; gap: 2cqw; align-items: center; justify-content: center; }
  .mode-btn {
    background: white; border: 2px solid var(--line);
    border-radius: 1cqw; padding: 1.6cqh 2.5cqw;
    font-family: var(--font-display); font-weight: 700;
    font-size: 19px;
    color: var(--ink); box-shadow: 0 3px 0 var(--line);
    transition: all 0.15s; display: flex; align-items: center; gap: 0.6em;
  }
  .mode-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .mode-btn.selected { border-color: var(--blue); box-shadow: 0 3px 0 var(--blue); background: #eef5fb; }
  .mode-btn .icon { font-size: 1.4em; }

  .start-btn {
    background: var(--accent); color: white;
    font-family: var(--font-display); font-weight: 900;
    font-size: 28px;
    padding: 1.8cqh 5cqw; border-radius: 999px;
    box-shadow: 0 5px 0 #c46d2c, 0 10px 20px rgba(240, 138, 62, 0.3);
    transition: all 0.15s; letter-spacing: 0.1em;
  }
  .start-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c46d2c; }
  .start-btn:disabled { background: #c8d2dc; box-shadow: 0 5px 0 #a8b2bc; cursor: not-allowed; }

  /* ============ MAIN SCREEN ============ */
  #mainScreen { flex-direction: column; padding: 1.5cqh 2cqw; gap: 1cqh; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 1cqw; flex-shrink: 0; }
  .top-bar .left, .top-bar .right { display: flex; gap: 1cqw; align-items: center; }
  .pill {
    background: white; border: 2px solid var(--line); border-radius: 999px;
    padding: 0.6cqh 1.2cqw; font-family: var(--font-display); font-weight: 700;
    font-size: 18px; color: var(--ink);
    display: flex; align-items: center; gap: 0.5em;
  }
  .pill .num { color: var(--accent); font-weight: 900; }
  .icon-btn {
    background: white; border: 2px solid var(--line); border-radius: 50%;
    width: clamp(40px, 5cqh, 56px); height: clamp(40px, 5cqh, 56px);
    font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 var(--line); transition: all 0.1s;
  }
  .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

  .main-body {
    flex: 1; display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(280px, 30cqw, 400px);
    gap: 1.5cqw; min-height: 0;
  }

  /* ============ LEFT: CALC PANEL ============ */
  .calc-panel {
    background: white; border: 2px solid var(--line); border-radius: 1.5cqw;
    position: relative; overflow: hidden; box-shadow: 0 4px 0 var(--line);
  }
  .calc-panel::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
    background: linear-gradient(to bottom, var(--accent-2), var(--accent));
    opacity: 0.6; z-index: 5;
  }
  .calc-grid {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    background-position: var(--gx, 0px) var(--gy, 0px);
  }
  .division { position: absolute; z-index: 2; }

  /* 右側: かけ算ワークスペース(残す) — グリッドに揃えた縦ひっ算 */
  .mult-workspace {
    position: absolute; z-index: 4;
    pointer-events: none;
  }
  .mult-ws-title {
    position: absolute;
    font-family: var(--font-display); font-weight: 700;
    font-size: 16px;
    color: var(--purple);
    background: #f3eff8; border: 1.5px solid var(--purple);
    border-radius: 999px; padding: 0.2em 0.9em;
    white-space: nowrap;
  }
  /* 1つ分の縦ひっ算(グリッド1マス=1文字) */
  .mult-hissan {
    position: absolute;
    border-radius: 10px;
    transition: background 0.25s, box-shadow 0.25s;
  }
  .mult-hissan.newpop { animation: multPop 0.4s cubic-bezier(0.34,1.4,0.64,1); }
  .mult-hissan.rejected { opacity: 0.6; }
  /* v2.8.3: 正解時の緑背景は「せいかい!」表示と重なって煩雑だったため削除 */

  .mult-cell {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-hand); font-weight: 600;
    color: var(--ink);
    line-height: 1;
  }
  .mult-cell.op { color: var(--purple); font-weight: 700; }
  .mult-cell.carry {
    color: var(--accent-2); font-weight: 700;
    align-items: flex-end; padding-bottom: 0.1em;
    opacity: 0.9;
  }
  .mult-cell.typing {
    color: var(--purple); font-weight: 700;
    background: rgba(138,111,176,0.1); border-radius: 6px;
  }
  .mult-cell.carry.typing-carry {
    color: var(--purple);
    background: rgba(138,111,176,0.1); border-radius: 6px;
  }
  /* かけ算の答えを わり算ひっ算へ転記するときの飛ぶ数字 */
  .fly-digit {
    position: absolute; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-hand); font-weight: 600;
    color: var(--purple);
    pointer-events: none;
    transition: left 0.55s cubic-bezier(0.5,0,0.3,1), top 0.55s cubic-bezier(0.5,0,0.3,1), transform 0.55s, color 0.55s;
  }
  .cell.copy-land { animation: copyLand 0.4s cubic-bezier(0.34,1.5,0.6,1); }
  @keyframes copyLand {
    0% { transform: scale(1.35); color: var(--purple); }
    60% { transform: scale(0.9); }
    100% { transform: scale(1); color: var(--ink); }
  }
  .p-row-highlight {
    position: absolute; z-index: 3; pointer-events: none;
    border: 2.5px dashed var(--accent-2); border-radius: 8px;
    opacity: 0; transition: opacity 0.3s;
  }
  .p-row-highlight.show { opacity: 0.85; animation: pRowPulse 1.2s ease-in-out infinite; }
  @keyframes pRowPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 0.95; } }
  .mult-hissan.rejected .mult-cell { color: var(--ink-soft); }
  /* 取り消し線(ひけない積) */
  .mult-strike {
    position: absolute; height: 3px; background: var(--accent-2);
    border-radius: 3px; z-index: 2;
    transform-origin: center;
  }
  .mult-underline {
    position: absolute; height: 3px; background: var(--ink); border-radius: 3px;
  }
  .mult-note {
    position: absolute;
    font-family: var(--font-display); font-weight: 700;
    white-space: nowrap;
  }
  .mult-hissan.rejected .mult-note { color: var(--accent-2); }
  .mult-cell.answer-blank {
    box-shadow: inset 0 0 0 2px rgba(138,111,176,0.4);
    border-radius: 6px; background: rgba(138,111,176,0.07);
  }
  .mult-cell.error { animation: shake 0.5s, flashRed 0.6s 3; color: var(--accent-2) !important; }
  .mult-cell.correct-pop { animation: pop 0.4s; }
  @keyframes multPop {
    0% { transform: scale(0.5) translateY(-10px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .cell {
    position: absolute; width: var(--cell); height: var(--cell);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-hand); font-weight: 600;
    font-size: calc(var(--cell) * 0.68);
    color: var(--ink);
    transition: background 0.25s ease, box-shadow 0.25s ease, opacity 0.35s ease;
    line-height: 1;
  }
  .cell.spot {
    background: rgba(245, 200, 66, 0.4); border-radius: 6px;
    box-shadow: 0 0 0 2px rgba(245, 200, 66, 0.7);
  }
  /* けんとうに使わないけた(まだ出番でないけた)を薄くする
     63÷21 で 6÷21 をみるとき → 「3」が薄い
     154÷15 で 1÷15 をみるとき → 「54」が薄い / 15÷15 のとき → 「4」が薄い */
  .cell.dim-unused {
    opacity: var(--dim-alpha);
  }
  .cell.hint-source, .divisor-cell.hint-source {
    color: var(--green) !important;
    animation: hintPulse 1.4s ease-in-out infinite !important;
    border-radius: 6px; z-index: 3;
  }
  @keyframes hintPulse {
    0%, 100% { background: rgba(90,159,107,0.15); box-shadow: 0 0 0 2px rgba(90,159,107,0.4); transform: scale(1); }
    50% { background: rgba(90,159,107,0.35); box-shadow: 0 0 0 4px rgba(90,159,107,0.7); transform: scale(1.08); }
  }

  /* 指隠しマスク: 一の位をかぶせる */
  .mask-cover {
    position: absolute; z-index: 6;
    border-radius: 8px;
    background:
      repeating-linear-gradient(45deg, var(--mask), var(--mask) 6px, #5b6b7d 6px, #5b6b7d 12px);
    box-shadow: 0 3px 8px rgba(44,58,74,0.35), inset 0 0 0 2px rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; pointer-events: auto;
    animation: maskDrop 0.3s cubic-bezier(0.34,1.3,0.64,1);
    transition: transform 0.12s;
  }
  .mask-cover:active { transform: scale(0.92); }
  .mask-cover::after {
    content: "✋"; font-size: calc(var(--cell) * 0.45); filter: grayscale(0.2);
  }
  @keyframes maskDrop {
    0% { transform: translateY(-40%) scale(0.8); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  /* マスクできる一の位に「ここ隠せるよ」のヒント枠 */
  .cell.maskable, .divisor-cell.maskable {
    box-shadow: inset 0 0 0 2px rgba(74,85,104,0.4);
    border-radius: 8px;
    cursor: pointer; pointer-events: auto;
    animation: maskableGlow 1.6s ease-in-out infinite;
  }
  @keyframes maskableGlow {
    0%,100% { box-shadow: inset 0 0 0 2px rgba(74,85,104,0.35); }
    50% { box-shadow: inset 0 0 0 3px rgba(74,85,104,0.7); }
  }
  /* 十の位: 見当に使う位を強調 */
  .cell.tens-focus, .divisor-cell.tens-focus {
    color: var(--blue) !important;
    animation: tensFocus 1.4s ease-in-out infinite;
    border-radius: 6px; z-index: 3;
  }
  @keyframes tensFocus {
    0%,100% { background: rgba(74,144,200,0.14); box-shadow: 0 0 0 2px rgba(74,144,200,0.35); }
    50% { background: rgba(74,144,200,0.3); box-shadow: 0 0 0 4px rgba(74,144,200,0.6); }
  }

  .cell.error { animation: shake 0.5s, flashRed 0.6s 3; color: var(--accent-2); }
  .cell.correct-pop { animation: pop 0.4s; color: var(--green); }
  .cell.fade-in { animation: fadeIn 0.3s; }
  .cell.drop-anim { animation: dropDown 0.6s cubic-bezier(0.34, 1.4, 0.64, 1); }
  .cell.faded { color: var(--line); opacity: 0.5; }
  /* へらす: 元の商に斜線、上に小さく1へらした商 */
  .cell.q-struck, .q-reduced.q-struck {
    color: var(--ink-soft); position: absolute;
  }
  .cell.q-struck { position: absolute; }
  .cell.q-struck::after, .q-reduced.q-struck::after {
    content: ""; position: absolute; left: 12%; right: 12%;
    top: 52%; height: 2.5px; background: var(--accent-2);
    border-radius: 2px; transform: rotate(-14deg);
  }
  .q-reduced {
    position: absolute; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-hand); font-weight: 700;
    color: var(--accent-2);
    line-height: 1;
    animation: qReducedPop 0.4s cubic-bezier(0.34,1.5,0.6,1);
  }
  @keyframes qReducedPop {
    0% { transform: translateY(6px) scale(0.5); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* v2.7.0: ひく でくり下がりが必要な位に重ねる小バッジ。
     もとのマス(hint-sourceの緑パルスなど)には手を加えず、独立した重ね表示にする。 */
  .borrow-mark {
    position: absolute; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-hand); font-weight: 700;
    line-height: 1; border-radius: 50%;
    color: white; pointer-events: none;
    box-shadow: 0 2px 4px rgba(44,58,74,0.3);
    animation: borrowMarkPop 0.35s cubic-bezier(0.34,1.5,0.6,1);
  }
  .borrow-mark.borrow-lend    { background: var(--purple); }
  .borrow-mark.borrow-receive { background: var(--purple); opacity: 0.88; }
  @keyframes borrowMarkPop {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* v2.8.1: 「かりる」ボタン(ひくの中で、くり下がりが必要な位のときだけ、筆算の右側に出す) */
  .borrow-btn {
    display: none; position: absolute; z-index: 6;
    background: white; border: 3px solid var(--purple); border-radius: 999px;
    box-shadow: 0 4px 0 var(--purple);
    align-items: center; justify-content: center; gap: 0.5em;
    padding: 0.55em 1.1em; font-family: var(--font-display);
    color: var(--purple); font-weight: 900; font-size: 16px;
    white-space: nowrap; transition: all 0.1s; cursor: pointer;
    animation: pulse 1.5s infinite;
  }
  .borrow-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--purple); }
  .borrow-btn .borrow-icon { font-size: 18px; }
  .borrow-btn.show { display: flex; }

  .divisor-cell {
    position: absolute; width: var(--cell); height: var(--cell);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-hand); font-weight: 600;
    font-size: calc(var(--cell) * 0.68);
    color: var(--ink); line-height: 1;
  }

  .bracket-line { position: absolute; width: 3px; background: var(--ink); border-radius: 3px; }
  .top-bar-line { position: absolute; height: 3px; background: var(--ink); border-radius: 3px; }
  .sub-line { position: absolute; height: 3px; background: var(--ink); border-radius: 3px; }

  .remainder-tag {
    position: absolute; display: flex; align-items: center; gap: 0.4em;
    font-family: var(--font-hand); font-size: calc(var(--cell) * 0.4);
    color: var(--ink-soft); white-space: nowrap; z-index: 3;
  }
  .remainder-tag .label { background: var(--paper-2); padding: 0.2em 0.5em; border-radius: 6px; }
  .remainder-tag .value { color: var(--accent); font-weight: 700; min-width: 1.2em; text-align: center; }

  /* 演算記号ヒント */
  .op-hint {
    position: absolute; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 900;
    font-size: calc(var(--cell) * 0.5); color: var(--green);
    pointer-events: none; z-index: 4;
    background: white; border: 2px solid var(--green); border-radius: 50%;
    width: calc(var(--cell) * 0.55); height: calc(var(--cell) * 0.55);
    box-shadow: 0 2px 8px rgba(90,159,107,0.35);
    animation: opHintIn 0.35s ease-out, opHintBounce 1.4s ease-in-out 0.35s infinite;
  }
  @keyframes opHintIn { 0% { transform: scale(0) rotate(-90deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
  @keyframes opHintBounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }

  /* 大きな赤丸 */
  .big-maru {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; z-index: 10; gap: 1cqh;
  }
  .big-maru .maru-svg-wrap {
    width: 40cqh; max-width: 90%; height: 40cqh; max-height: 90%;
    animation: maruDraw 0.6s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
  }
  .big-maru svg { width: 100%; height: 100%; }
  .big-maru circle {
    fill: none; stroke: var(--maru-red); stroke-width: 12; stroke-linecap: round;
    stroke-dasharray: 1200; stroke-dashoffset: 1200;
    animation: maruStroke 0.7s ease-out forwards;
    filter: drop-shadow(0 4px 8px rgba(230, 57, 70, 0.3));
  }
  @keyframes maruDraw { 0% { transform: scale(0.3) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.1) rotate(5deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
  @keyframes maruStroke { to { stroke-dashoffset: 0; } }
  .big-maru .seikai-text {
    white-space: nowrap;
    font-family: var(--font-display); font-weight: 900;
    font-size: 38px; color: var(--maru-red);
    background: white; padding: 0.4em 1.2em; border-radius: 999px;
    border: 3px solid var(--maru-red);
    box-shadow: 0 6px 0 #b32530, 0 10px 25px rgba(230, 57, 70, 0.3);
    letter-spacing: 0.15em; opacity: 0; animation: textPop 0.4s 0.6s forwards;
  }
  @keyframes textPop { 0% { transform: translateY(20px) scale(0.5); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }

  /* 大きな赤ばつ(1つの工程で3回まちがえたときの不正解表示) */
  .big-batsu {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; z-index: 10; gap: 1cqh;
  }
  .big-batsu .batsu-svg-wrap {
    width: 40cqh; max-width: 90%; height: 40cqh; max-height: 90%;
    animation: maruDraw 0.6s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
  }
  .big-batsu svg { width: 100%; height: 100%; }
  .big-batsu line {
    stroke: var(--maru-red); stroke-width: 12; stroke-linecap: round;
    stroke-dasharray: 400; stroke-dashoffset: 400;
    filter: drop-shadow(0 4px 8px rgba(230, 57, 70, 0.3));
  }
  .big-batsu line:nth-child(1) { animation: batsuStroke1 0.35s ease-out forwards; }
  .big-batsu line:nth-child(2) { animation: batsuStroke2 0.35s ease-out 0.3s forwards; }
  @keyframes batsuStroke1 { to { stroke-dashoffset: 0; } }
  @keyframes batsuStroke2 { to { stroke-dashoffset: 0; } }
  .big-batsu .fuseikai-text {
    white-space: nowrap;
    font-family: var(--font-display); font-weight: 900;
    font-size: 34px; color: var(--maru-red);
    background: white; padding: 0.4em 1.2em; border-radius: 999px;
    border: 3px solid var(--maru-red);
    box-shadow: 0 6px 0 #b32530, 0 10px 25px rgba(230, 57, 70, 0.3);
    letter-spacing: 0.15em; opacity: 0; animation: textPop 0.4s 0.65s forwards;
  }

  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  @keyframes flashRed { 0%,100% { background: transparent; } 50% { background: rgba(232,90,79,0.3); border-radius: 8px; } }
  @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dropDown { 0% { transform: translateY(calc(var(--cell) * -3)); opacity: 0; } 60% { transform: translateY(calc(var(--cell) * 0.2)); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }

  /* ============ RIGHT: CONTROLS ============ */
  .controls { display: flex; flex-direction: column; gap: 1.5cqh; min-height: 0; }
  .step-panel {
    background: white; border: 2px solid var(--line); border-radius: 1.5cqw;
    padding: 1.6cqh 1.2cqw; box-shadow: 0 4px 0 var(--line);
  }
  .panel-header {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 0.2cqh; margin-bottom: 1cqh;
  }
  .panel-title { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--ink); }
  .step-hint { font-family: var(--font-hand); font-size: 16px; color: var(--ink-soft); }
  .step-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7cqw; }
  .step-btn {
    aspect-ratio: 1 / 0.9;
    background: white; border: 3px solid var(--line); border-radius: 1cqw;
    box-shadow: 0 4px 0 var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.3cqh; transition: all 0.1s; font-family: var(--font-display);
  }
  .step-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .step-btn .step-icon { font-size: 26px; }
  .step-btn .step-label { font-weight: 900; font-size: 21px; letter-spacing: 0.05em; }
  .step-btn .step-sub { font-family: var(--font-hand); font-weight: 600; font-size: 12px; color: var(--ink-soft); }
  .step-btn.tateru { color: var(--blue); }
  .step-btn.tateru.next  { border-color: var(--blue); box-shadow: 0 4px 0 var(--blue); background: #eef5fb; animation: pulse 1.5s infinite; }
  .step-btn.kakeru { color: var(--green); }
  .step-btn.kakeru.next  { border-color: var(--green); box-shadow: 0 4px 0 var(--green); background: #edf5ee; animation: pulse 1.5s infinite; }
  .step-btn.hiku   { color: var(--purple); }
  .step-btn.hiku.next    { border-color: var(--purple); box-shadow: 0 4px 0 var(--purple); background: #f1edf5; animation: pulse 1.5s infinite; }
  .step-btn.orosu  { color: var(--accent); }
  .step-btn.orosu.next   { border-color: var(--accent); box-shadow: 0 4px 0 var(--accent); background: #fff5eb; animation: pulse 1.5s infinite; }
  .step-btn.herasu { color: var(--accent-2); }
  .step-btn.herasu.next  { border-color: var(--accent-2); box-shadow: 0 4px 0 var(--accent-2); background: #fdeceb; animation: pulse 1.5s infinite; }
  .step-btn.wrong { animation: shake 0.5s; background: #fde8e6; border-color: var(--accent-2); }
  @keyframes pulse { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  .numpad-panel {
    background: white; border: 2px solid var(--line); border-radius: 1.5cqw;
    padding: 1.6cqh 1.2cqw; box-shadow: 0 4px 0 var(--line);
    flex: 1; display: flex; flex-direction: column; min-height: 0;
  }
  .numpad-panel.disabled .num-btn { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .numpad-panel.disabled { background: #f8f5ed; }
  .numpad-grid {
    flex: 1; display: grid; grid-template-columns: repeat(5, 1fr) 1.75fr;
    grid-template-rows: repeat(2, minmax(0, 94px)); gap: 0.7cqw; min-height: 0; align-content: center;
  }
  .num-btn {
    background: white; border: 3px solid var(--line); border-radius: 1cqw;
    font-family: var(--font-hand); font-weight: 600;
    font-size: 36px; color: var(--ink);
    box-shadow: 0 4px 0 var(--line); transition: all 0.08s;
    display: flex; align-items: center; justify-content: center;
  }
  .numpad-panel:not(.disabled) .num-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent); background: #fff8ef; }
  .num-btn.wrong { animation: shake 0.5s; background: #fde8e6; border-color: var(--accent-2); color: var(--accent-2); }

  /* 「しょうが たたない」ときの × キー。すうじと区別できるよう色と位置を変える */
  .batsu-btn {
    grid-column: 6; grid-row: 1 / 3;
    color: var(--accent-2); border-color: var(--accent-2);
    box-shadow: 0 4px 0 var(--accent-2);
    background: #fdf3f2;
    flex-direction: column; gap: 0.15em; line-height: 1.05; padding: 0.2em 0.1em;
  }
  .batsu-btn .batsu-glyph { font-size: 1.3em; font-weight: 700; }
  .batsu-btn .batsu-cap {
    font-family: var(--font-display); font-weight: 700;
    font-size: 14px; color: var(--accent-2);
    line-height: 1.25; text-align: center; white-space: nowrap;
  }
  .numpad-panel:not(.disabled) .batsu-btn:active {
    transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-2); background: #fbe6e4;
  }
  /* 商の行に書かれた × */
  .cell.batsu-mark { color: var(--accent-2); font-size: 1.3em; }

  /* 「1へらす」大ボタン(修正が必要なとき用) */
  .herasu-action {
    background: var(--accent-2); color: white;
    border-radius: 1cqw; padding: 1.6cqh 1cqw;
    font-family: var(--font-display); font-weight: 900;
    font-size: 21px;
    box-shadow: 0 4px 0 #b3453c; transition: all 0.1s;
    display: none; align-items: center; justify-content: center; gap: 0.5em;
    animation: pulse 1.2s infinite;
  }
  .herasu-action.show { display: flex; }
  .herasu-action:active { transform: translateY(3px); box-shadow: 0 1px 0 #b3453c; }

  .next-q-btn {
    position: absolute; bottom: 4cqh; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: white;
    font-family: var(--font-display); font-weight: 900;
    font-size: 23px; padding: 1.8cqh 4cqw; border-radius: 999px;
    box-shadow: 0 5px 0 #c46d2c, 0 10px 25px rgba(240, 138, 62, 0.4);
    z-index: 20; letter-spacing: 0.08em; display: none;
  }
  .next-q-btn:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 2px 0 #c46d2c; }
  .next-q-btn.show { display: block; }

  .skip-btn {
    position: absolute; top: 1.5cqh; right: 1.5cqh; z-index: 6;
    background: rgba(255,255,255,0.75); border: 1.5px solid var(--line); border-radius: 999px;
    padding: 0.6cqh 1.1cqw; font-family: var(--font-ui);
    font-size: 15px; color: var(--ink-soft);
    box-shadow: 0 2px 0 var(--line); opacity: 0.55; transition: all 0.15s; letter-spacing: 0.03em;
  }
  .skip-btn:hover { opacity: 0.95; }
  .skip-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); opacity: 1; }

  /* ============ RESULT SCREEN ============ */
  #resultScreen { flex-direction: column; align-items: center; justify-content: center; padding: 4cqh 4cqw; gap: 3cqh; }
  .result-card {
    background: white; border-radius: 2cqw; padding: 5cqh 8cqw;
    box-shadow: 0 8px 0 var(--line), 0 20px 40px var(--shadow);
    text-align: center; border: 3px solid var(--accent); position: relative;
  }
  .result-emoji { font-size: clamp(4rem, 12cqh, 7rem); line-height: 1; margin-bottom: 2cqh; animation: bounce 1.5s infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  .result-title { font-family: var(--font-display); font-weight: 900; font-size: 34px; color: var(--ink); margin-bottom: 1cqh; }
  .result-score { font-family: var(--font-display); font-weight: 900; font-size: 50px; color: var(--accent); margin: 2cqh 0; }
  .result-score small { font-size: 0.5em; color: var(--ink-soft); }
  .result-msg { font-family: var(--font-hand); font-size: 19px; color: var(--ink-soft); margin-bottom: 3cqh; }
  .result-buttons { display: flex; gap: 2cqw; justify-content: center; }
  .result-btn { background: white; border: 3px solid var(--line); color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 20px; padding: 1.5cqh 2.5cqw; border-radius: 999px; box-shadow: 0 4px 0 var(--line); transition: all 0.15s; }
  .result-btn.primary { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 0 #c46d2c; }
  .result-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
  .result-btn.primary:active { box-shadow: 0 2px 0 #c46d2c; }
  .confetti { position: fixed; pointer-events: none; inset: 0; overflow: hidden; z-index: 50; }
  .confetti-piece { position: absolute; width: 12px; height: 12px; opacity: 0.9; animation: confettiFall linear forwards; }
  @keyframes confettiFall { 0% { transform: translateY(-820px) rotate(0deg); } 100% { transform: translateY(880px) rotate(720deg); } }

  /* ============ RESPONSIVE ============ */
  
  /* ============ 10.1インチ基準ステージ (1280x800) ============
     すべてのレイアウトは 1280x800 の固定キャンバス上で組み、
     実際の画面サイズに合わせて丸ごと拡大縮小する。
     → どの端末でも 10.1インチと同じ見た目・同じ比率になる。
     内部の cqw / cqh はキャンバス基準 (1cqw=12.8px, 1cqh=8px 固定)。   */
  :root {
    --design-w: 1280px;
    --design-h: 800px;
    --stage-scale: 1;
  }
  #stage {
    position: fixed;
    left: 50%; top: 50%;
    width: var(--design-w); height: var(--design-h);
    transform: translate(-50%, -50%) scale(var(--stage-scale));
    transform-origin: center center;
    container-type: size;
    overflow: hidden;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(245, 200, 66, 0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(74, 144, 200, 0.08), transparent 40%);
  }
  /* たて向きのときの案内(ステージの外に置くので拡大縮小の対象外) */
  #rotateHint {
    position: fixed; inset: 0; z-index: 9999; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
    background: var(--paper); text-align: center; padding: 6vw;
  }
  #rotateHint .rh-icon { font-size: 18vw; line-height: 1; animation: rhTurn 2.2s ease-in-out infinite; }
  #rotateHint .rh-text {
    font-family: var(--font-display); font-weight: 900;
    font-size: 6vw; color: var(--ink); letter-spacing: 0.08em; line-height: 1.6;
  }
  #rotateHint .rh-sub { font-family: var(--font-hand); font-size: 3.6vw; color: var(--ink-soft); }
  @keyframes rhTurn { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(78deg); } }
  @media (orientation: portrait) {
    #rotateHint { display: flex; }
    #stage { visibility: hidden; }
  }
  :root { --kk-u: 1px; }
  /* ============ からくり屋敷 (ゲーミフィケーション) ============ */
  :root { --kk-wood: #8a5a33; --kk-wood-d: #5e3b1f; --kk-paper: #fbf6ea; --kk-gold: #e0a020; --kk-red: #c8382c; }
  .kk-house {
    display: flex; align-items: center; justify-content: center; gap: calc(var(--kk-u) * 14);
    margin: calc(var(--kk-u) * 4) auto 0; padding: calc(var(--kk-u) * 6) calc(var(--kk-u) * 18);
    background: linear-gradient(#6b4325, #5a381e); color: #fff6df; border-radius: calc(var(--kk-u) * 12);
    box-shadow: 0 calc(var(--kk-u) * 3) 0 #3e2612; font-weight: 800; width: max-content; max-width: 96vw; box-sizing: border-box; flex-wrap: wrap; row-gap: calc(var(--kk-u) * 2);
    font-size: calc(var(--kk-u) * 17); line-height: 1.3; position: relative;
  }
  .kk-house::before { content: ''; position: absolute; left: 50%; top: calc(var(--kk-u) * -11); transform: translateX(-50%);
    border-left: calc(var(--kk-u) * 70) solid transparent; border-right: calc(var(--kk-u) * 70) solid transparent;
    border-bottom: calc(var(--kk-u) * 11) solid #6b4325; }
  .kk-house > span { white-space: nowrap; }
  .kk-house .kk-hname { letter-spacing: 0.08em; }
  .kk-house .kk-prog { background: rgba(255,255,255,0.14); border-radius: 999px; padding: 0 calc(var(--kk-u) * 12); }
  .kk-house .kk-prog b { color: #ffd76a; font-size: 1.15em; }
  .kk-house .kk-rank { color: #ffd76a; }
  .kk-house .kk-bag { letter-spacing: 0.06em; font-size: 1.05em; }
  .kk-house .kk-bag .kk-none { opacity: 0.35; filter: grayscale(1); }
  .kk-house.kk-escaped { background: linear-gradient(#b8860b, #8a6208); box-shadow: 0 calc(var(--kk-u) * 3) 0 #5e4205; }
  .kk-house.kk-escaped::before { border-bottom-color: #b8860b; }

  .level-card { position: relative; }
  .level-card .kk-room { font-weight: 800; color: var(--kk-wood-d); white-space: nowrap; }
  .level-card .kk-room .kk-ic { margin-right: 0.15em; }
  .level-card .kk-room .kk-ic.kk-none { filter: grayscale(1); opacity: 0.35; }
  .level-card .kk-stars { color: #d8d2c4; letter-spacing: 0.1em; line-height: 1; margin-top: calc(var(--kk-u) * 3); font-size: calc(var(--kk-u) * 17); }
  .level-card .kk-stars .on { color: var(--kk-gold); }
  .level-card.kk-cleared { background: linear-gradient(#fffaf0, #fbf0da); }
  .level-card .kk-hanko {
    position: absolute; top: calc(var(--kk-u) * 6); right: calc(var(--kk-u) * 6);
    width: calc(var(--kk-u) * 34); height: calc(var(--kk-u) * 34); border-radius: 50%;
    border: calc(var(--kk-u) * 2.5) solid var(--kk-red); color: var(--kk-red);
    font-size: calc(var(--kk-u) * 12); font-weight: 900; line-height: 1.05;
    display: flex; align-items: center; justify-content: center; transform: rotate(-14deg); background: rgba(255,255,255,0.7);
  }
  .level-card .kk-hidden-tag { position: absolute; top: calc(var(--kk-u) * -10); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: calc(var(--kk-u) * 11);
    color: #fff; background: #7a5aa6; border-radius: 999px; padding: 0 calc(var(--kk-u) * 7); font-weight: 800; }

  /* 出題中のからくり錠 */
  .kk-lock { display: inline-flex !important; align-items: center; gap: calc(var(--kk-u) * 6); }
  .kk-lock .kk-gear { display: inline-block; transition: transform 0.5s ease; }
  .kk-lock .kk-bar { position: relative; display: inline-block; width: calc(var(--kk-u) * 110); height: calc(var(--kk-u) * 12);
    border-radius: 999px; background: #eee6d6; overflow: hidden; border: 1px solid #d9ccb2; }
  .kk-lock .kk-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #c88b4a, #e0a020); transition: width 0.35s ease; }
  .kk-lock.kk-open .kk-bar i { background: linear-gradient(90deg, #e0a020, #ffd76a); }
  .kk-lock.kk-open .kk-lock-ic { animation: kkPop 0.6s ease; }
  .kk-lock.kk-fail .kk-bar i { background: #c9c2b5; }
  @keyframes kkPop { 0% { transform: scale(1); } 40% { transform: scale(1.6) rotate(-10deg); } 100% { transform: scale(1); } }

  /* ふすま (つぎの とびら) */
  .kk-fusuma { position: absolute; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
  .kk-fusuma .kk-door {
    position: absolute; top: 0; bottom: 0; width: 50.5%;
    background-color: var(--kk-paper);
    background-image:
      linear-gradient(90deg, rgba(138,90,51,0.18) 2px, transparent 2px),
      linear-gradient(rgba(138,90,51,0.18) 2px, transparent 2px);
    background-size: 25% 16.6%;
    border: calc(var(--kk-u) * 9) solid var(--kk-wood);
    box-shadow: inset 0 0 0 calc(var(--kk-u) * 2) var(--kk-wood-d);
    transition: transform 0.65s cubic-bezier(.6,.05,.3,1);
  }
  .kk-fusuma .kk-door.l { left: 0; }
  .kk-fusuma .kk-door.r { right: 0; }
  .kk-fusuma .kk-door::after { content: ''; position: absolute; top: 50%; width: calc(var(--kk-u) * 22); height: calc(var(--kk-u) * 22);
    margin-top: calc(var(--kk-u) * -11); border-radius: 50%; background: radial-gradient(#3e2612 35%, #8a5a33 40%, #b88a55 70%); }
  .kk-fusuma .kk-door.l::after { right: calc(var(--kk-u) * 14); }
  .kk-fusuma .kk-door.r::after { left: calc(var(--kk-u) * 14); }
  .kk-fusuma .kk-plate {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;
    background: var(--kk-wood-d); color: #fff6df; border: calc(var(--kk-u) * 3) solid #c8a06a; border-radius: calc(var(--kk-u) * 10);
    padding: calc(var(--kk-u) * 12) calc(var(--kk-u) * 26); text-align: center; font-weight: 900; white-space: nowrap;
    font-size: calc(var(--kk-u) * 26); line-height: 1.4; transition: opacity 0.3s;
  }
  .kk-fusuma .kk-plate small { display: block; font-size: 0.62em; font-weight: 700; color: #ffd76a; }
  .kk-fusuma.open .kk-door.l { transform: translateX(-102%); }
  .kk-fusuma.open .kk-door.r { transform: translateX(102%); }
  .kk-fusuma.open .kk-plate { opacity: 0; }

  .kk-toast {
    position: absolute; left: 50%; top: calc(var(--kk-u) * 14); transform: translateX(-50%); z-index: 41; pointer-events: none;
    background: var(--kk-wood-d); color: #ffd76a; font-weight: 900; border-radius: 999px; white-space: nowrap;
    padding: calc(var(--kk-u) * 6) calc(var(--kk-u) * 20); font-size: calc(var(--kk-u) * 20);
    animation: kkToast 1.9s ease forwards;
  }
  @keyframes kkToast { 0% { opacity: 0; transform: translate(-50%, -10px); } 15%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

  /* 結果画面 */
  .result-card.kk-compact .result-emoji { font-size: calc(var(--kk-u) * 64); margin-bottom: calc(var(--kk-u) * 4); }
  .result-card.kk-compact .result-score { margin: calc(var(--kk-u) * 6) 0; }
  .result-card.kk-compact .result-msg { margin-bottom: calc(var(--kk-u) * 10); }

  /* ============ からくり屋敷のメニュー画面 ============ */
  #titleScreen {

    background-color: #efe2c4;
    background-image:
      /* 左右の柱 */
      linear-gradient(90deg, #6b4325 0, #8a5a33 calc(var(--kk-u) * 14), #5e3b1f calc(var(--kk-u) * 18), transparent calc(var(--kk-u) * 18),
                             transparent calc(100% - var(--kk-u) * 18), #5e3b1f calc(100% - var(--kk-u) * 18), #8a5a33 calc(100% - var(--kk-u) * 14), #6b4325 100%),
      /* 床(板の間) */
      linear-gradient(to top, #7a5030 0, #9a6a40 calc(var(--kk-u) * 22), #5e3b1f calc(var(--kk-u) * 24), transparent calc(var(--kk-u) * 24)),
      /* 土かべの むら */
      radial-gradient(circle at 18% 30%, rgba(255,255,255,0.35), transparent 35%),

    background:
      linear-gradient(to bottom, transparent calc(100% - var(--kk-u) * 9), #5e3b1f calc(100% - var(--kk-u) * 9), #8a5a33 calc(100% - var(--kk-u) * 3), #3e2612 100%),
      repeating-linear-gradient(90deg, #4a5462 0, #5c6676 calc(var(--kk-u) * 10), #3a424e calc(var(--kk-u) * 22), #2a3039 calc(var(--kk-u) * 24)),
      #3a424e;
    box-shadow: 0 calc(var(--kk-u) * 4) calc(var(--kk-u) * 10) rgba(60,35,15,0.35);
  }
  #titleScreen > * { position: relative; z-index: 1; }
  #titleScreen .kk-gearDeco { position: absolute; z-index: 2; top: calc(var(--kk-u) * 6); font-size: calc(var(--kk-u) * 26); line-height: 1;
    animation: kkSpin 9s linear infinite; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5)); pointer-events: none; }

  @keyframes kkSpin { to { transform: rotate(360deg); } }

  .kk-crest-mini { display: inline-block; width: calc(var(--kk-u) * 28); height: calc(var(--kk-u) * 28); color: #ffd76a; }
  .kk-house .kk-doors b { color: #b5452f; font-size: 1.1em; }
  .kk-house .kk-doors small { margin-left: 0.4em; font-size: 0.75em; color: #8b7355; }
  .kk-rbar { display: inline-block; vertical-align: middle; margin-left: 0.4em; width: calc(var(--kk-u) * 70); height: calc(var(--kk-u) * 9);
    background: #e3d3b3; border-radius: 99px; overflow: hidden; }
  .kk-rbar i { display: block; height: 100%; background: linear-gradient(90deg, #c88b4a, #e0a020); }

  /* --- からくり帳・家紋 --- */
  .kk-book { position: absolute !important; inset: 0; z-index: 60 !important; background: rgba(30,18,8,0.6); display: flex; align-items: center; justify-content: center; }
  .kk-book-panel { width: min(94%, calc(var(--kk-u) * 1100)); max-height: 92%; overflow-y: auto; background: #fbf6ea; border: calc(var(--kk-u) * 6) solid #6b4325;
    border-radius: calc(var(--kk-u) * 10); padding: calc(var(--kk-u) * 14); box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  .kk-tabs { display: flex; gap: calc(var(--kk-u) * 10); margin-bottom: calc(var(--kk-u) * 12); }
  .kk-tabs button { font-weight: 900; font-size: calc(var(--kk-u) * 19); padding: calc(var(--kk-u) * 6) calc(var(--kk-u) * 18); border-radius: calc(var(--kk-u) * 8);
    background: #efe2c4; color: #5e3b1f; border: calc(var(--kk-u) * 2) solid #c8a06a; }
  .kk-tabs button.on { background: #6b4325; color: #fff3d6; }
  .kk-tabs .kk-close { margin-left: auto; background: #fff; }
  .kk-pages { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--kk-u) * 12); }
  .kk-pg { position: relative; background: #fffdf6; border: calc(var(--kk-u) * 2) solid #d8c8a8; border-radius: calc(var(--kk-u) * 6); padding: calc(var(--kk-u) * 8);
    text-align: center; color: #3e2612; font-size: calc(var(--kk-u) * 13); line-height: 1.45; }
  .kk-pg-pic { position: relative; width: 70%; margin: 0 auto calc(var(--kk-u) * 4); aspect-ratio: 1; }
  .kk-pg-pic .q { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: calc(var(--kk-u) * 48); color: #fff; font-weight: 900; }
  .kk-gim-svg { width: 100%; height: 100%; display: block; }
  .kk-pg.t0 .kk-gim-svg { filter: brightness(0) opacity(0.35); }
  .kk-pg.t1 .kk-gim-svg { filter: grayscale(1) contrast(1.2); }
  .kk-pg.t3, .kk-pg.t4 { border-color: #e0a020; background: linear-gradient(#fffaf0, #fff0c4); box-shadow: 0 0 0 calc(var(--kk-u) * 2) #ffd76a inset; }
  .kk-pg-room { font-size: 0.9em; color: #8b7355; font-weight: 700; }
  .kk-pg-name { font-weight: 900; font-size: 1.3em; font-family: var(--kk-mincho, serif); }
  .kk-pg-how { min-height: 3em; }
  .kk-pg-foot { margin-top: calc(var(--kk-u) * 4); font-size: 0.9em; color: #8b7355; }
  .kk-pg-foot b { color: #b5452f; }
  .kk-pg-hanko { position: absolute; right: calc(var(--kk-u) * 8); top: calc(var(--kk-u) * 8); width: calc(var(--kk-u) * 38); height: calc(var(--kk-u) * 38); border-radius: 50%;
    border: calc(var(--kk-u) * 3) solid #c8382c; color: #c8382c; font-weight: 900; display: flex; align-items: center; justify-content: center; transform: rotate(-14deg); }
  .kk-crests { display: grid; grid-template-columns: repeat(7, 1fr); gap: calc(var(--kk-u) * 10); }
  .kk-cr { text-align: center; color: #8b7355; font-size: calc(var(--kk-u) * 12); line-height: 1.35; padding: calc(var(--kk-u) * 6) calc(var(--kk-u) * 2);
    border-radius: calc(var(--kk-u) * 8); background: #f3ebdc; }
  .kk-cr-pic { width: 72%; margin: 0 auto calc(var(--kk-u) * 4); aspect-ratio: 1; color: #cfc3ad; }
  .kk-crest-svg { width: 100%; height: 100%; display: block; }
  .kk-cr.got { background: linear-gradient(#fff8e0, #ffeab0); color: #3e2612; }
  .kk-cr.got .kk-cr-pic { color: #2a2a40; background: radial-gradient(circle, #fff 55%, transparent 56%); border-radius: 50%; }
  .kk-cr-name { font-weight: 900; font-size: 1.1em; }
  .kk-cr-prog { font-weight: 800; color: #b5452f; }

  /* --- 出題中の 廊下 --- */
  .kk-corr { position: relative; width: calc(var(--kk-u) * 360); height: calc(var(--kk-u) * 50); flex-shrink: 1; min-width: calc(var(--kk-u) * 160);
    background: linear-gradient(#f3e6c8 0 72%, #9a6a40 72%); border: calc(var(--kk-u) * 2) solid #8a5a33; border-radius: calc(var(--kk-u) * 8); overflow: visible; }
  .kk-corr-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 28%; background: repeating-linear-gradient(90deg, transparent 0 calc(var(--kk-u) * 22), rgba(62,38,18,0.35) calc(var(--kk-u) * 22) calc(var(--kk-u) * 23)); }
  .kk-cd { position: absolute; bottom: 28%; width: calc(var(--kk-u) * 28); height: 62%; transform: translateX(-50%); background: #1c140c; border: calc(var(--kk-u) * 2) solid #5e3b1f; overflow: hidden; }
  .kk-cd i { position: absolute; top: 0; bottom: 0; width: 50%; background: #fbf6ea;
    background-image: linear-gradient(90deg, rgba(138,90,51,0.4) 1px, transparent 1px), linear-gradient(rgba(138,90,51,0.4) 1px, transparent 1px);
    background-size: 50% 33%; transition: transform 0.45s ease; }
  .kk-cd i.l { left: 0; } .kk-cd i.r { right: 0; }
  .kk-cd.open { background: radial-gradient(#ffe7a8, #e0a020); }
  .kk-cd.open i.l { transform: translateX(-100%); } .kk-cd.open i.r { transform: translateX(100%); }
  .kk-cd.cur { border-color: #e0a020; box-shadow: 0 0 calc(var(--kk-u) * 6) #ffd76a; }
  .kk-cd.shut i { background: #cfc6b5; }
  .kk-cd.shut::after { content: '×'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8b2a1f; font-weight: 900; font-size: calc(var(--kk-u) * 16); }
  .kk-cgear { position: absolute; top: calc(var(--kk-u) * -13); font-size: calc(var(--kk-u) * 15); line-height: 1; transform: translateX(-50%); transition: transform 0.45s ease; z-index: 2; }
  .kk-cprog { position: absolute; bottom: calc(var(--kk-u) * 2); width: calc(var(--kk-u) * 30); height: calc(var(--kk-u) * 5); transform: translateX(-50%); background: rgba(255,255,255,0.4); border-radius: 99px; overflow: hidden; }
  .kk-cprog i { display: block; height: 100%; width: 0; background: #ffd76a; transition: width 0.35s; }
  .kk-cchar { position: absolute; bottom: 18%; height: 86%; aspect-ratio: 40 / 56; transform: translateX(-50%); transition: left 0.8s ease-in-out; z-index: 3; }

  /* --- からくり 演出 --- */
  .kk-gim-ov { position: absolute; inset: 0; z-index: 80; background: rgba(20,12,6,0.94); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--kk-u) * 14); cursor: pointer; transition: opacity 0.3s; }
  .kk-gim-ov.fade { opacity: 0; }
  .kk-gim-title { color: #ffd76a; font-weight: 900; font-size: calc(var(--kk-u) * 22); text-align: center; line-height: 1.4; font-family: var(--kk-mincho, serif); }
  .kk-gim-title b { display: block; color: #fff3d6; font-size: 1.7em; letter-spacing: 0.1em; }
  .kk-gim-sub { color: #fff3d6; font-weight: 900; font-size: calc(var(--kk-u) * 26); opacity: 0; transform: scale(0.6); transition: all 0.4s; }
  .kk-gim-ov.done .kk-gim-sub { opacity: 1; transform: scale(1); }
  .kk-gim-skip { color: #c8b89a; font-size: calc(var(--kk-u) * 13); }
  .kk-scene { position: relative; width: calc(var(--kk-u) * 520); height: calc(var(--kk-u) * 320); overflow: hidden; border-radius: calc(var(--kk-u) * 8);
    background: #efe2c4; border: calc(var(--kk-u) * 8) solid #5e3b1f; perspective: calc(var(--kk-u) * 600); }
  .kk-scene > div { position: absolute; }
  .kk-sc-ceil { left: 0; right: 0; top: 0; height: 10%; background: #8a5a33; border-bottom: calc(var(--kk-u) * 4) solid #5e3b1f; }
  .kk-sc-floor { left: 0; right: 0; bottom: 0; height: 18%; background: repeating-linear-gradient(90deg, #9a6a40 0 calc(var(--kk-u) * 60), #7a5030 calc(var(--kk-u) * 60) calc(var(--kk-u) * 62)); border-top: calc(var(--kk-u) * 4) solid #5e3b1f; }
  .kk-sc-beam { top: 10%; bottom: 18%; width: 4%; background: #8a5a33; }
  .kk-sc-beam.l { left: 12%; } .kk-sc-beam.r { right: 12%; }
  .kk-sc-hole { background: radial-gradient(ellipse at 50% 60%, #3a2a1a, #120c06); overflow: hidden; }
  .kk-sc-sky { position: absolute; inset: 0; background: linear-gradient(#8ec5e8, #cfe8f5 70%, #8fc070 70%); }
  .kk-sc-sky::after { content: ''; position: absolute; right: 18%; top: 14%; width: 18%; aspect-ratio: 1; border-radius: 50%; background: #ffd76a; box-shadow: 0 0 calc(var(--kk-u) * 20) #ffd76a; }
  .kk-sc-steps { position: absolute; inset: 0; display: none; }
  .kk-sc-mech, .kk-sc-mech2 { transition: transform 0.9s cubic-bezier(.5,.1,.3,1), height 0.9s ease, width 0.9s ease; }
  .kk-sc-mech i { display: none; }
  .kk-sc-gear { display: none; font-size: calc(var(--kk-u) * 40); line-height: 1; transition: transform 1.2s ease; }
  .kk-sc-char { left: 6%; bottom: 17%; height: 30%; aspect-ratio: 40 / 56; transition: left 0.9s ease-in-out, transform 0.6s ease, opacity 0.6s ease; z-index: 5; }
  .kk-scene.walk .kk-sc-char { left: 45%; }
  .kk-scene.gone .kk-sc-char { opacity: 0; transform: scale(0.7); }

  /* どんでんがえし */
  .kk-sc-donden .kk-sc-hole { left: 38%; width: 24%; top: 10%; bottom: 18%; }
  .kk-sc-donden .kk-sc-mech { left: 38%; width: 24%; top: 10%; bottom: 18%; background: #efe2c4; border: calc(var(--kk-u) * 3) solid #8a5a33;
    background-image: linear-gradient(90deg, transparent 48%, rgba(138,90,51,0.3) 48% 52%, transparent 52%); }
  .kk-sc-donden.go .kk-sc-mech { transform: rotateY(78deg); }
  /* かくし とだな */
  .kk-sc-tansu .kk-sc-hole { left: 40%; width: 20%; top: 30%; bottom: 18%; }
  .kk-sc-tansu .kk-sc-mech { left: 37%; width: 26%; top: 34%; bottom: 18%; background: #9a6a40; border: calc(var(--kk-u) * 3) solid #3e2612;
    background-image: linear-gradient(transparent 31%, #3e2612 31% 34%, transparent 34% 64%, #3e2612 64% 67%, transparent 67%),
      radial-gradient(circle at 50% 16%, #e0b060 4%, transparent 5%), radial-gradient(circle at 50% 49%, #e0b060 4%, transparent 5%), radial-gradient(circle at 50% 83%, #e0b060 4%, transparent 5%); }
  .kk-sc-tansu.go .kk-sc-mech { transform: translateX(125%); }
  /* たたみがえし */
  .kk-sc-tatami .kk-sc-hole { left: 40%; width: 24%; bottom: 0; height: 18%; z-index: 1; }
  .kk-sc-tatami .kk-sc-steps, .kk-sc-kaidan .kk-sc-steps { display: block; background: repeating-linear-gradient(170deg, transparent 0 calc(var(--kk-u) * 9), #8a5a33 calc(var(--kk-u) * 9) calc(var(--kk-u) * 13)); opacity: 0.8; }
  .kk-sc-tatami .kk-sc-mech { left: 40%; width: 24%; bottom: 13%; height: 6%; background: #b8c47a; border: calc(var(--kk-u) * 2) solid #5a6a2a; transform-origin: 0% 100%; z-index: 2; }
  .kk-sc-tatami.go .kk-sc-mech { transform: rotate(-80deg); }
  .kk-sc-tatami.walk .kk-sc-char { left: 47%; }
  .kk-sc-tatami.gone .kk-sc-char, .kk-sc-kaidan.gone .kk-sc-char { transform: translateY(60%) scale(0.8); }
  /* かけじく */
  .kk-sc-kakejiku .kk-sc-hole { left: 42%; width: 16%; top: 28%; bottom: 18%; }
  .kk-sc-kakejiku .kk-sc-mech { left: 40%; width: 20%; top: 12%; height: 62%; background: #fffaf0; border: calc(var(--kk-u) * 3) solid #8a5a33; border-top-width: calc(var(--kk-u) * 8);
    background-image: radial-gradient(circle at 50% 40%, transparent 22%, #3e2612 23% 26%, transparent 27%); transform-origin: 50% 0; }
  .kk-sc-kakejiku.go .kk-sc-mech { transform: scaleY(0.07); }
  /* おとしど */
  .kk-sc-otoshido .kk-sc-hole { left: 40%; width: 20%; top: 0; height: 11%; z-index: 1; }
  .kk-sc-otoshido .kk-sc-mech { left: 40%; width: 20%; top: 6%; height: 5%; background: #9a6a40; border: calc(var(--kk-u) * 2) solid #3e2612; transform-origin: 0 0; z-index: 2; }
  .kk-sc-otoshido.go .kk-sc-mech { transform: rotate(80deg); }
  .kk-sc-otoshido .kk-sc-mech2 { left: 44%; width: 12%; top: 10%; height: 0; z-index: 2;
    background: linear-gradient(90deg, #8a5a33 0 14%, transparent 14% 86%, #8a5a33 86%), repeating-linear-gradient(transparent 0 calc(var(--kk-u) * 22), #8a5a33 calc(var(--kk-u) * 22) calc(var(--kk-u) * 27)); }
  .kk-sc-otoshido.go .kk-sc-mech2 { height: 72%; transition-delay: 0.5s; }
  .kk-sc-otoshido.walk .kk-sc-char { left: 44%; }
  .kk-sc-otoshido.gone .kk-sc-char { transform: translateY(-140%) scale(0.8); }
  /* かくし かいだん */
  .kk-sc-kaidan .kk-sc-hole { left: 36%; width: 28%; bottom: 0; height: 18%; z-index: 1; }
  .kk-sc-kaidan .kk-sc-mech, .kk-sc-kaidan .kk-sc-mech2 { bottom: 12%; height: 6%; width: 14%; background: #c8a06a; border: calc(var(--kk-u) * 2) solid #5e3b1f; z-index: 2; }
  .kk-sc-kaidan .kk-sc-mech { left: 36%; } .kk-sc-kaidan .kk-sc-mech2 { left: 50%; }
  .kk-sc-kaidan.go .kk-sc-mech { transform: translateX(-100%); } .kk-sc-kaidan.go .kk-sc-mech2 { transform: translateX(100%); }
  /* はぐるまの とびら・おおもん */
  .kk-sc-gate .kk-sc-hole, .kk-sc-bigGate .kk-sc-hole { left: 34%; width: 32%; top: 22%; bottom: 18%; }
  .kk-sc-bigGate .kk-sc-hole { left: 28%; width: 44%; top: 16%; }
  .kk-sc-gate .kk-sc-mech, .kk-sc-bigGate .kk-sc-mech { left: 34%; width: 32%; top: 22%; bottom: 18%; z-index: 2;
    background: repeating-linear-gradient(90deg, #5e3b1f 0 calc(var(--kk-u) * 8), transparent calc(var(--kk-u) * 8) calc(var(--kk-u) * 30)),
      repeating-linear-gradient(transparent 0 calc(var(--kk-u) * 40), #5e3b1f calc(var(--kk-u) * 40) calc(var(--kk-u) * 48)); }
  .kk-sc-bigGate .kk-sc-mech { left: 28%; width: 44%; top: 16%; background-color: #6b4325; }
  .kk-sc-gate.go .kk-sc-mech, .kk-sc-bigGate.go .kk-sc-mech { transform: translateY(-105%); transition-duration: 1.2s; }
  .kk-sc-gate .kk-sc-gear, .kk-sc-bigGate .kk-sc-gear { display: block; top: 11%; z-index: 3; }
  .kk-sc-gate .kk-sc-gear.a, .kk-sc-bigGate .kk-sc-gear.a { left: 20%; } .kk-sc-gate .kk-sc-gear.b, .kk-sc-bigGate .kk-sc-gear.b { right: 20%; }
  .kk-sc-gate.go .kk-sc-gear.a, .kk-sc-bigGate.go .kk-sc-gear.a { transform: rotate(360deg); }
  .kk-sc-gate.go .kk-sc-gear.b, .kk-sc-bigGate.go .kk-sc-gear.b { transform: rotate(-360deg); }
  .kk-sc-gate .kk-sc-ceil, .kk-sc-bigGate .kk-sc-ceil { z-index: 3; }

  /* --- 結果画面 --- */
  .kk-res-head { font-size: 1.1em; }
  .kk-res-head .kk-res-stars { font-size: 1.4em; vertical-align: middle; }
  .kk-res .kk-gets { flex-wrap: wrap; gap: calc(var(--kk-u) * 10) calc(var(--kk-u) * 18); margin: calc(var(--kk-u) * 6) 0; }
  .kk-chip { display: flex; align-items: center; gap: calc(var(--kk-u) * 6); text-align: left; font-size: 0.85em; line-height: 1.3; animation: kkGet 0.7s ease 0.2s both; }
  .kk-chip .kk-big { font-size: calc(var(--kk-u) * 34); line-height: 1; }
  .kk-chip-pg, .kk-chip-crest { display: inline-block; width: calc(var(--kk-u) * 44); height: calc(var(--kk-u) * 44); }
  .kk-chip-crest { color: #2a2a40; background: radial-gradient(circle, #fff 55%, transparent 56%); border-radius: 50%; }
  .kk-chip-pg.t1 .kk-gim-svg { filter: grayscale(1); }
  .kk-res-doors { margin-top: calc(var(--kk-u) * 4); font-size: 0.9em; }
  .kk-res-doors b { color: #b5452f; }
  .kk-res-doors small { margin-left: 0.4em; color: #8b7355; }
  .kk-rank-name { margin-left: 0.5em; color: #b5452f; }
  .kk-rankup { margin-top: calc(var(--kk-u) * 4); color: #b5452f; animation: kkGet 0.7s ease 0.4s both; }
  .result-card.kk-compact .result-emoji { font-size: calc(var(--kk-u) * 44); }
  .result-card.kk-compact .result-title { font-size: calc(var(--kk-u) * 28); margin-bottom: 0; }
  .result-card.kk-compact .result-score { font-size: calc(var(--kk-u) * 40); margin: calc(var(--kk-u) * 2) 0; }
  .result-card.kk-compact .result-msg { margin-bottom: calc(var(--kk-u) * 8); }
  .result-card.kk-compact { padding-top: calc(var(--kk-u) * 18); padding-bottom: calc(var(--kk-u) * 18); }
  /* Ⅱ: タイトル画面に看板が入るぶん、つめる */
  #titleScreen { gap: 1.4cqh; padding-top: 2cqh; padding-bottom: 2cqh; }
  .app-title { font-size: 44px; }
  .app-subtitle { font-size: 18px; margin-top: 0.2em; }
  .version-badge { position: absolute; top: 0; right: 0; margin-top: 0; font-size: 13px; }
  .level-card { padding: 1.1cqh 0.8cqw; min-height: 0; gap: 0.3cqh; }
  .level-card .lv-num { font-size: 30px; }
  .level-card .lv-num small { margin-bottom: 0.15em; }
  .kk-house { margin-top: 1.4cqh; }
  #titleScreen { gap: 0.9cqh; padding-top: 50px !important; padding-bottom: 34px; justify-content: flex-start; }
  #titleScreen .app-title { font-size: 38px; }
  .kk-house { margin-top: 0.8cqh; }
  #titleScreen .start-btn { font-size: 25px; padding: 1.3cqh 5cqw; margin-top: 0.4cqh; }
  #titleScreen .mode-btn { padding: 1.2cqh 2.5cqw; }
  #titleScreen .level-card { padding: 0.8cqh 0.8cqw; }
  .kk-map { width: calc(445px * var(--kk-map-ar)); max-width: 1000px; }
</style>
</head>
<body>
<div id="stage">

<!-- ============ TITLE SCREEN ============ -->
<div id="titleScreen" class="screen active">
  <div class="title-header">
    <h1 class="app-title">わりざんの<span class="accent">ひっ算</span>れんしゅう<span class="badge2">Ⅱ</span></h1>
    <p class="app-subtitle">〜 2けた・3けたで わる ・ ゆびかくしで けんとうを つける 〜</p>
    <div class="version-badge"><span class="dot"></span>バージョン <span class="vnum" id="titleVersion">2.6.0</span></div>
  </div>

  <div>
    <div class="section-label"><span class="deco">1.</span> レベルを えらぼう</div>
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <div>
    <div class="section-label"><span class="deco">2.</span> モードを えらぼう</div>
    <div class="mode-row">
      <button class="mode-btn selected" data-mode="fixed">
        <span class="icon">📚</span><span>こていもんだい</span>
      </button>
      <button class="mode-btn" data-mode="random">
        <span class="icon">🎲</span><span>ランダムもんだい</span>
      </button>
    </div>
  </div>

  <button class="start-btn" id="startBtn" disabled>はじめる →</button>
</div>

<!-- ============ MAIN SCREEN ============ -->
<div id="mainScreen" class="screen">
  <div class="top-bar">
    <div class="left">
      <button class="icon-btn" id="backBtn" title="タイトルへ もどる">↩</button>
      <div class="pill">レベル <span class="num" id="levelDisplay">1</span></div>
      <div class="pill">もんだい <span class="num" id="qNumDisplay">1</span> / <span id="qTotalDisplay">5</span></div>
    </div>
    <div class="right">
      <div class="pill version-pill">ver <span class="vnum" id="mainVersion">2.6.0</span></div>
      <div class="pill">⭕ <span class="num" id="correctDisplay">0</span></div>
    </div>
  </div>

  <div class="main-body">
    <div class="calc-panel" id="calcPanel">
      <div class="calc-grid" id="calcGrid">
        <div class="division" id="division"></div>
      </div>
      <!-- 右側かけ算ワークスペース -->
      <div class="mult-workspace" id="multWorkspace"></div>
      <!-- v2.8.1: くり下がりの「かりる」ボタン(筆算の右側、必要なときだけ表示) -->
      <button class="borrow-btn" id="borrowBtn">
        <span class="borrow-icon">↩️</span><span>10 かりる</span>

    d.doors = d.doors || 0;

      case 'hishi': m = `<polygon points="0,-30 22,0 0,30 -22,0" fill="${F}"/><polygon points="0,-12 9,0 0,12 -9,0" fill="#fbf6ea"/>`; break;
      case 'kikyo': m = `<polygon points="${Array.from({ length: 10 }, (_, i) => { const r = i % 2 ? 13 : 30, a = (i * 36 - 90) * Math.PI / 180; return (Math.cos(a) * r).toFixed(1) + ',' + (Math.sin(a) * r).toFixed(1); }).join(' ')}" fill="${F}"/><circle r="5" fill="#fbf6ea"/>`; break;
      case 'ume': m = rot(5, `<circle cy="-18" r="11" fill="${F}"/>`) + `<circle r="7" fill="#fbf6ea"/><circle r="3" fill="${F}"/>`; break;
      case 'hanabishi': m = `<g fill="${F}">${[[0, -15], [15, 0], [0, 15], [-15, 0]].map(([x, y]) => `<polygon points="${x},${y - 12} ${x + 10},${y} ${x},${y + 12} ${x - 10},${y}"/>`).join('')}</g>`; break;
      case 'jumonji': m = `<g fill="${F}"><rect x="-6" y="-30" width="12" height="60"/><rect x="-30" y="-6" width="60" height="12"/></g>`; break;
      case 'nichirin': m = rot(12, `<polygon points="0,-33 4,-24 -4,-24" fill="${F}"/>`) + `<circle r="18" fill="${F}"/>`; break;
    }
    return `<svg viewBox="-50 -50 100 100" class="kk-crest-svg" aria-hidden="true"><circle r="45" fill="none" stroke="${F}" stroke-width="5"/>${m}</svg>`;
  }

  /* ---------- 家紋 ---------- */
  function hankoCount() { return Object.values(data.rooms).filter(r => r.hk).length; }
  const BADGES = [
    { id: 'first', name: 'はじめの とびら', motif: 'ichi', cond: 'とびらを 1つ あける', prog: () => [data.doors, 1] },
    { id: 'd30', name: 'とびら 三十', motif: 'igeta', cond: 'とびらを 30 あける', prog: () => [data.doors, 30] },
    { id: 'd100', name: 'とびら 百', motif: 'kikko', cond: 'とびらを 100 あける', prog: () => [data.doors, 100] },
    { id: 'tateru', name: 'たてるの もん', motif: 'yaguruma', cond: '「たてる」を 100かい', prog: () => [data.c.tateru || 0, 100] },
    { id: 'kakeru', name: 'かけるの もん', motif: 'haguruma', cond: '「かける」を 100かい', prog: () => [data.c.kakeru || 0, 100] },
    { id: 'hiku', name: 'ひくの もん', motif: 'uroko', cond: '「ひく」を 100かい', prog: () => [data.c.hiku || 0, 100] },
    { id: 'orosu', name: 'おろすの もん', motif: 'ougi', cond: '「おろす」を 40かい', prog: () => [data.c.orosu || 0, 40] },
    { id: 'zero', name: 'れいの もん', motif: 'tsuki', cond: CFG.app === 2 ? 'しょうの 0 や ×を 15かい ただしく' : 'しょうの 0を 15かい ただしく', prog: () => [data.c.zero || 0, 15] },
    CFG.app === 2
      ? { id: 'herasu', name: 'へらすの もん', motif: 'chigaiya', cond: '「へらす」を 20かい', prog: () => [data.c.herasu || 0, 20] }
      : { id: 'hidden', name: 'かくしべやの もん', motif: 'hishi', cond: 'ちかの へやを だっしゅつ', prog: () => [(room(7).st || 0) > 0 ? 1 : 0, 1] },
    { id: 'meijin', name: '名人の もん', motif: 'kikyo', cond: '名人の はんこを 3つ あつめる', prog: () => [hankoCount(), 3] },
    { id: 'streak', name: 'つづけるの もん', motif: 'ume', cond: '3日 つづけて ちょうせん', prog: () => [Math.max(data.c.bestStreak || 0, streak()), 3] },
    { id: 'random', name: 'ランダムの もん', motif: 'hanabishi', cond: 'ランダムもんだいで 3へや だっしゅつ', prog: () => [data.c.random || 0, 3] },
    { id: 'chal', name: 'チャレンジの もん', motif: 'jumonji', cond: 'チャレンジで ★★★', prog: () => [(room(lastLevel()).st || 0) >= 3 ? 1 : 0, 1] },
    { id: 'escape', name: 'だっしゅつの もん', motif: 'nichirin', cond: 'やかたから だっしゅつ', prog: () => [data.escaped ? 1 : 0, 1] },
  ];
  function checkBadges() {
    const got = [];
    BADGES.forEach(b => {
      if (data.badges[b.id]) return;
      const [cur, goal] = b.prog();
      if (cur >= goal) { data.badges[b.id] = today(); got.push(b); }
    });
    return got;
  }

  /* ---------- からくり帳 ---------- */
  function pageTier(lv) { const r = room(lv); return (r.st || 0) + (r.hk ? 1 : 0); }
  const TIER_NAME = ['まだ ひみつ', 'すみえ', 'いろつき', 'きんいろ', '名人の ページ'];
  const TIER_NEXT = ['この へやを だっしゅつすると ページが ひらく', '★★で 色が つく', '★★★で きんいろに なる', 'ノーミスで 名人の はんこ', 'かんせい！'];

  /* ---------- タイトル(メニュー) ---------- */
  function levelInfo(lv) {
    const L = (typeof LEVELS !== 'undefined') ? LEVELS[lv] : null;
    if (!L) return { tag: 'LEVEL ' + lv, desc: '' };
    const tag = L.isChallenge ? 'チャレンジ ★' : 'LEVEL ' + (L.badge || lv) + (L.badgeSub ? ` <i>${L.badgeSub}</i>` : '');
    return { tag, desc: (L.desc || '').replace('\n', ' ') };
  }
  function goalLevel() {
    const s = st();
    if (s && s.level && CFG.rooms[s.level]) return String(s.level);
    const g = CFG.groups.find(g => !groupCleared(g));
    return String(g ? g[0] : lastLevel());
  }
  const P = (v, base) => (v / base * 100) + '%';

  function buildMap(ts) {
    const wrap = document.getElementById('levelGrid').parentElement;
    const map = document.createElement('div');
    map.id = 'kkMap'; map.className = 'kk-map';
    map.style.aspectRatio = `1000 / ${MAPH}`;
    map.style.setProperty('--kk-map-ar', 1000 / MAPH);
    let html = '';
    const M = CFG.map;
    // 地面・石垣
    html += `<div class="kk-ground" style="top:${P(M.ground, MAPH)}"></div>`;
    if (M.stone) html += `<div class="kk-stone" style="left:${P(40, 1000)};width:${P(920, 1000)};top:${P(M.ground, MAPH)};height:${P(MAPH - M.ground, MAPH)}"></div>`;
    M.tiers.forEach(t => {
      if (t.roof === 'gable') {
        html += `<div class="kk-roof gable" style="left:${P(t.x - 130, 1000)};width:${P(t.w + 260, 1000)};top:${P(t.y - 62, MAPH)};height:${P(t.h + 82, MAPH)}"></div>`;
      } else if (t.roof === 'castle') {
        html += `<div class="kk-roof castle" style="left:${P(t.x - 50, 1000)};width:${P(t.w + 100, 1000)};top:${P(t.y - 52, MAPH)};height:${P(50, MAPH)}"><i class="l"></i><i class="r"></i></div>`;
      } else if (t.roof === 'eave') {
        html += `<div class="kk-roof eave" style="left:${P(t.x - 26, 1000)};width:${P(t.w + 52, 1000)};top:${P(t.y - 24, MAPH)};height:${P(22, MAPH)}"></div>`;
      }
      html += `<div class="kk-tier${t.roof === 'under' ? ' under' : ''}" style="left:${P(t.x, 1000)};top:${P(t.y, MAPH)};width:${P(t.w, 1000)};height:${P(t.h, MAPH)}"></div>`;
    });
    (M.stairs || []).forEach(([x, y, d]) => {
      html += `<div class="kk-stairs ${d}" style="left:${P(x - 30, 1000)};top:${P(y - 20, MAPH)};width:${P(60, 1000)};height:${P(40, MAPH)}"></div>`;
    });
    Object.keys(CFG.rooms).forEach(lv => {
      const r = CFG.rooms[lv].rect;
      html += `<button class="kk-mroom" data-level="${lv}" style="left:${P(r[0], 1000)};top:${P(r[1], MAPH)};width:${P(r[2], 1000)};height:${P(r[3], MAPH)}"></button>`;
    });
    html += `<div class="kk-mchar" id="kkMapChar">${charSvg()}</div>`;
    map.innerHTML = html;
    wrap.appendChild(map);
    map.querySelectorAll('.kk-mroom').forEach(el => {
      el.onclick = () => {
        const card = document.querySelector(`.level-card[data-level="${el.dataset.level}"]`);
        if (card) card.click();
        updateMapSel();
      };
    });
    ts.classList.add('kk-has-map');
  }
  function renderMap() {
    const map = document.getElementById('kkMap');
    if (!map) return;
    map.querySelectorAll('.kk-mroom').forEach(el => {
      const lv = el.dataset.level, cfg = CFG.rooms[lv], r = room(lv), info = levelInfo(lv);
      const lit = (r.st || 0) > 0;
      el.classList.toggle('lit', lit);
      el.classList.toggle('hidden-room', !!cfg.hidden);
      el.classList.toggle('chal', lv === lastLevel());
      el.innerHTML = `<span class="kk-mr-lv">${info.tag}</span>
        <span class="kk-mr-name">${cfg.name}</span>
        <span class="kk-mr-desc">${info.desc}</span>
        <span class="kk-mr-stars">${starHtml(r.st || 0)}</span>
        ${r.it ? `<span class="kk-mr-item" title="${cfg.item}">${cfg.icon}</span>` : ''}
        ${r.hk ? '<span class="kk-mr-hanko">名人</span>' : ''}
        ${cfg.hidden ? '<span class="kk-mr-hid">かくしべや</span>' : ''}`;
    });
    updateMapSel(true);
  }
  function updateMapSel(instant) {
    const map = document.getElementById('kkMap');
    if (!map) return;
    map.querySelectorAll('.kk-mroom').forEach(el => {
      const card = document.querySelector(`.level-card[data-level="${el.dataset.level}"]`);
      el.classList.toggle('sel', !!(card && card.classList.contains('selected')));
    });
    const sel = map.querySelector('.kk-mroom.sel');
    const lv = sel ? sel.dataset.level : goalLevel();
    const r = CFG.rooms[lv].rect;
    const ch = document.getElementById('kkMapChar');
    const chH = Math.min(62, r[3] * 0.5);
    const left = P(r[0] + 10, 1000), top = P(r[1] + r[3] - chH - 4, MAPH);
    if (instant) ch.classList.add('noanim');
    else if (ch.style.left && ch.style.left !== left) {
      ch.classList.add('walk');
      clearTimeout(ch._t); ch._t = setTimeout(() => ch.classList.remove('walk'), 950);
    }
    ch.style.left = left; ch.style.top = top; ch.style.height = P(chH, MAPH);
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => ch.classList.remove('noanim')));
  }

  function decorateTitle() {
    const ts = document.getElementById('titleScreen');
    const grid = document.getElementById('levelGrid');
    if (!ts || !grid) return;
    const n = clearedCount(), all = CFG.groups.length;
    const rk = rankInfo(data.doors);
    // やかたの ふだ
    let bar = document.getElementById('kkHouse');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'kkHouse'; bar.className = 'kk-house';
      ts.querySelector('.title-header').appendChild(bar);
    }
    bar.classList.toggle('kk-escaped', n === all);
    ts.classList.toggle('kk-escaped', n === all);
    bar.innerHTML = `<span class="kk-hname">🏯 からくり屋敷 ${CFG.house}</span>
      <span class="kk-prog">${n === all ? 'だっしゅつ せいこう！' : `だっしゅつ <b>${n}</b> / ${all} へや`}</span>
      <span class="kk-rank">${rk.name}</span>
      <span class="kk-doors">🚪 とびら <b>${data.doors}</b><span class="kk-rbar"><i style="width:${rk.pct}%"></i></span>${rk.next ? `<small>つぎまで ${rk.next - data.doors}</small>` : ''}</span>`;

    if (!ts.querySelector('.kk-gearDeco')) {
      ['l', 'r'].forEach(side => {
        const g = document.createElement('div');
        g.className = 'kk-gearDeco ' + side; g.textContent = '⚙️';
        ts.appendChild(g);
      });
      const labels = ts.querySelectorAll('.section-label');
      if (labels[0]) labels[0].innerHTML = '<span class="deco">1.</span> へや(レベル)を えらぼう';
      const sb = document.getElementById('startBtn');
      if (sb) sb.textContent = 'へやに はいる →';
      buildMap(ts);
      // 下の段：からくり帳・モード・はいる・家紋
      const modeWrap = ts.querySelector('.mode-row').parentElement;
      const bottom = document.createElement('div');
      bottom.className = 'kk-bottom';
      const bBook = document.createElement('button');
      bBook.className = 'kk-bookbtn'; bBook.id = 'kkBookBtn';
      bBook.onclick = () => openBook('book');
      const bCrest = document.createElement('button');
      bCrest.className = 'kk-bookbtn'; bCrest.id = 'kkCrestBtn';
      bCrest.onclick = () => openBook('crest');
      modeWrap.parentElement.insertBefore(bottom, modeWrap);
      const books = document.createElement('div');
      books.className = 'kk-books';
      books.appendChild(bBook); books.appendChild(bCrest);
      bottom.appendChild(books); bottom.appendChild(modeWrap); bottom.appendChild(sb);
      // 先生用
      const b = document.createElement('button');
      b.id = 'kkTeacher'; b.className = 'kk-teacher'; b.textContent = '先生用：きろくを けす';
      b.onclick = () => {
        if (!confirm('からくり屋敷の きろく(★・道具・はんこ・とびら・家紋)を すべて けしますか？')) return;
        if (!confirm('ほんとうに けしますか？ もとには もどせません。')) return;
        data = load(); data = { rooms: {}, c: {}, badges: {}, days: [], doors: 0 }; save(); decorateTitle();
      };
      ts.appendChild(b);
    }
    const pages = Object.keys(CFG.rooms).filter(lv => pageTier(lv) > 0).length;
    document.getElementById('kkBookBtn').innerHTML = `<span class="ic">📜</span><span>からくり帳<small>${pages} / ${Object.keys(CFG.rooms).length}</small></span>`;
    document.getElementById('kkCrestBtn').innerHTML = `<span class="ic kk-crest-mini">${crestSvg('kikyo')}</span><span>かもん<small>${Object.keys(data.badges).length} / ${BADGES.length}</small></span>`;

    // もとの カード(スマホ幅で つかう)
    grid.querySelectorAll('.level-card').forEach(card => {
      const lv = card.dataset.level, cfg = CFG.rooms[lv];
      if (!cfg) return;
      const r = room(lv);
      card.querySelectorAll('.kk-stars, .kk-hanko, .kk-hidden-tag').forEach(e => e.remove());
      const t = card.querySelector('.lv-title');
      if (t) { t.classList.add('kk-room'); t.innerHTML = `<span class="kk-ic ${r.it ? '' : 'kk-none'}">${cfg.icon}</span>${cfg.name}`; }
      const s = document.createElement('div'); s.className = 'kk-stars'; s.innerHTML = starHtml(r.st || 0); card.appendChild(s);
      if (r.hk) { const h = document.createElement('div'); h.className = 'kk-hanko'; h.innerHTML = '名人'; card.appendChild(h); }
      if (cfg.hidden) { const h = document.createElement('div'); h.className = 'kk-hidden-tag'; h.textContent = 'かくしべや'; card.appendChild(h); }
      card.classList.toggle('kk-cleared', (r.st || 0) > 0);
      if (!card._kk) { card._kk = true; card.addEventListener('click', () => setTimeout(() => updateMapSel(), 0)); }
    });
    renderMap();
  }

  /* ---------- からくり帳・家紋 ---------- */
  function openBook(tab) {
    const ts = document.getElementById('titleScreen');
    let ov = document.getElementById('kkBook');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'kkBook'; ov.className = 'kk-book';
      ov.onclick = e => { if (e.target === ov) ov.remove(); };
      ts.appendChild(ov);
    }
    const tabs = `<div class="kk-tabs">
      <button class="${tab === 'book' ? 'on' : ''}" data-t="book">📜 からくり帳</button>
      <button class="${tab === 'crest' ? 'on' : ''}" data-t="crest">かもん</button>
      <button class="kk-close">✕ とじる</button></div>`;
    let body = '';
    if (tab === 'book') {
      body = '<div class="kk-pages">' + Object.keys(CFG.rooms).map(lv => {
        const cfg = CFG.rooms[lv], g = GIM[cfg.gim], t = pageTier(lv), info = levelInfo(lv);
        return `<div class="kk-pg t${t}">
          <div class="kk-pg-pic">${gimSvg(cfg.gim)}${t === 0 ? '<span class="q">？</span>' : ''}</div>
          <div class="kk-pg-room">${info.tag.replace(/<i>.*<\/i>/, '')} ・ ${cfg.name}</div>
          <div class="kk-pg-name">${t > 0 ? g.name : '？？？'}</div>
          <div class="kk-pg-how">${t > 0 ? g.how : ''}</div>
          <div class="kk-pg-foot"><b>${TIER_NAME[t]}</b>${t < 4 ? '<br>' + TIER_NEXT[t] : ''}</div>
          ${t >= 4 ? '<span class="kk-pg-hanko">名人</span>' : ''}
        </div>`;
      }).join('') + '</div>';
    } else {
      body = '<div class="kk-crests">' + BADGES.map(b => {
        const got = data.badges[b.id];
        const [cur, goal] = b.prog();
        return `<div class="kk-cr ${got ? 'got' : ''}">
          <div class="kk-cr-pic">${crestSvg(b.motif)}</div>
          <div class="kk-cr-name">${got ? b.name : '？？？'}</div>
          <div class="kk-cr-cond">${b.cond}</div>
          <div class="kk-cr-prog">${got ? '✓ ' + Number(got.slice(5, 7)) + 'がつ' + Number(got.slice(8, 10)) + 'にち' : `${Math.min(cur, goal)} / ${goal}`}</div>
        </div>`;
      }).join('') + '</div>';
    }
    ov.innerHTML = `<div class="kk-book-panel">${tabs}${body}</div>`;
    ov.querySelectorAll('.kk-tabs [data-t]').forEach(b => b.onclick = () => openBook(b.dataset.t));
    ov.querySelector('.kk-close').onclick = () => ov.remove();
  }

  /* ---------- 出題中：廊下 ---------- */
  function ensureCorr() {
    let el = document.getElementById('kkCorr');
    if (!el) {
      el = document.createElement('div');
      el.id = 'kkCorr'; el.className = 'kk-corr';
      document.querySelector('#mainScreen .top-bar .left').appendChild(el);
    }
    return el;
  }
  const doorX = (i, n) => ((i + 1) / (n + 1) * 100);
  function renderCorr() {
    if (!run) return;
    const el = ensureCorr();
    const n = run.total;
    let html = '<div class="kk-corr-floor"></div>';
    for (let i = 0; i < n; i++) {
      const s = run.doors[i];
      html += `<div class="kk-cd ${s || ''} ${i === run.cur && !s ? 'cur' : ''}" style="left:${doorX(i, n)}%"><i class="l"></i><i class="r"></i></div>`;
    }
    html += `<div class="kk-cgear" style="left:${doorX(run.cur, n)}%">⚙️</div>`;
    html += `<div class="kk-cprog" style="left:${doorX(run.cur, n)}%"><i></i></div>`;
    html += `<div class="kk-cchar" id="kkCorrChar">${charSvg()}</div>`;
    el.innerHTML = html;
  }
  function placeCorrChar(x, animate) {
    const ch = document.getElementById('kkCorrChar');
    if (!ch) return;
    if (!animate) ch.classList.add('noanim');
    else { ch.classList.add('walk'); clearTimeout(ch._t); ch._t = setTimeout(() => ch.classList.remove('walk'), 900); }
    ch.style.left = x + '%';
    if (!animate) requestAnimationFrame(() => requestAnimationFrame(() => ch.classList.remove('noanim')));
  }
  function setProg(done, total) {
    const p = document.querySelector('#kkCorr .kk-cprog i');
    if (p) p.style.width = (total ? Math.min(100, done / total * 100) : 0) + '%';
  }

  function startRoom(level) {
    const s = st();
    run = { level: String(level), perfect: true, total: s && s.questions ? s.questions.length : 5,
            doors: [], cur: 0, doors0: data.doors, gear: 0, prevTier: pageTier(String(level)) };
  }

  function onLoadQuestion(qIdx, total) {
    if (!run) startRoom(st().level);
    run.total = total; run.cur = qIdx;
    // つぎの とびらの まえ(1問目は 左はし)へ 歩く
    const prevX = qIdx === 0 ? 2 : doorX(qIdx - 1, total);
    renderCorr();
    placeCorrChar(prevX, false);
    if (qIdx > 0) setTimeout(() => placeCorrChar(doorX(qIdx, total) - 7, true), 60);
    else placeCorrChar(doorX(0, total) - 7, false);
    setProg(0, 1);
    document.querySelectorAll('#calcPanel .kk-toast').forEach(e => e.remove());
    const cfg = CFG.rooms[run.level];
    if (cfg && qIdx === 0) fusuma(`🚪 ${cfg.name}<small>からくりの とびら ${total}つを ひらこう</small>`, 900);
  }
  function fusuma(label, wait) {
    const panel = document.getElementById('calcPanel');
    if (!panel) return;
    panel.querySelectorAll('.kk-fusuma').forEach(e => e.remove());
    const f = document.createElement('div');
    f.className = 'kk-fusuma';
    f.innerHTML = `<div class="kk-door l"></div><div class="kk-door r"></div><div class="kk-plate">${label}</div>`;
    panel.appendChild(f);
    setTimeout(() => f.classList.add('open'), wait);
    setTimeout(() => f.remove(), wait + 800);
  }
  function toast(text) {
    const panel = document.getElementById('calcPanel');
    if (!panel) return;
    panel.querySelectorAll('.kk-toast').forEach(e => e.remove());
    const t = document.createElement('div');
    t.className = 'kk-toast'; t.textContent = text;
    panel.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }
  function countStep(step) {
    if (!step) return;
    const k = step.kind;
    data.c[k] = (data.c[k] || 0) + 1;
    if (k === 'tateru' && typeof getExpectedDigits === 'function') {
      try { const e = getExpectedDigits(step).join(''); if (e === '0' || e === '×') data.c.zero = (data.c.zero || 0) + 1; } catch (e) {}
    }
  }
  function onStep(done, total) {
    const c = st() && st().current;
    if (c) countStep(c.plan.steps[c.stepIdx - 1]);
    setProg(done, total);
    if (run) {
      run.gear += 90;
      const g = document.querySelector('#kkCorr .kk-cgear');
      if (g) { g.style.transform = `translateX(-50%) rotate(${run.gear}deg)`; }
    }
  }
  function onSolved(errorCount) {
    const c = st() && st().current;
    if (c) countStep(c.plan.steps[c.stepIdx - 1]);
    if (run && errorCount > 0) run.perfect = false;
    data.doors++;
    const d = today();
    if (!data.days.includes(d)) { data.days.push(d); data.days = data.days.slice(-14); }
    data.c.bestStreak = Math.max(data.c.bestStreak || 0, streak());
    save();
    if (run) {
      run.doors[run.cur] = 'open';
      setProg(1, 1);
      renderCorr();
      placeCorrChar(doorX(run.cur, run.total) - 7, false);
      setTimeout(() => placeCorrChar(doorX(run.cur, run.total), true), 450);
    }
    toast(errorCount <= 1 ? '🔓 カチャッ！ とびらが ひらいた！' : '🔓 とびらが ひらいた！ (まちがいが 2かい いじょう)');
  }
  function onFailed() {

    run.perfect = false;
    run.doors[run.cur] = 'shut';

  /* ---------- からくりの 演出 ---------- */
  function playGimmick(type, host, onEnd) {

        <div class="kk-sc-hole">${g.out ? '<div class="kk-sc-sky"></div>' : ''}<div class="kk-sc-steps"></div></div>
        <div class="kk-sc-mech"><i></i><i></i><i></i><i></i></div>
        <div class="kk-sc-mech2"></div>
        <div class="kk-sc-gear a">⚙️</div><div class="kk-sc-gear b">⚙️</div>

  /* ---------- 結果画面 ---------- */
  function onResults(correct, total) {

    if (chips.length) html += `<div class="kk-gets">${chips.join('')}</div>`;
    if (!firstHanko && stars === 3 && !r.hk && chips.length < 3) html += `<div class="kk-res-sub">まちがい・ヒント なしで とくと「名人の はんこ」が もらえるよ</div>`;
    html += `<div class="kk-res-doors">🚪 とびら <b>+${gained}</b>（ぜんぶで ${data.doors}） <span class="kk-rank-name">${rk.name}</span>
